<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Objednávky</title>
<style>
:root{
  --bg:#f4f1ea;--card:#fff;--ink:#1d2320;--muted:#6b716c;--line:#e3ddd1;
  --brand:#1f2a24;--accent:#c8732e;--ok:#2f7d4f;--okbg:#e3f2e8;--warn:#b5461f;--warnbg:#fbe6dc;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121614;--card:#1c2220;--ink:#eef0ec;--muted:#9aa19c;--line:#2c3431;
  --brand:#0c0f0e;--accent:#e08a42;--ok:#5cc187;--okbg:#1d3326;--warn:#f08a62;--warnbg:#3a2219;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer;border-radius:10px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:env(safe-area-inset-top) 12px 0}
.bar{display:flex;align-items:center;gap:8px;height:52px}
.bar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;padding-bottom:8px}
.tabs button{flex:1;background:transparent;color:#c9d0cb;padding:9px 6px;font-weight:600}
.tabs button.on{background:#ffffff1f;color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e25b3a;margin-left:6px;vertical-align:middle}
.conn{font-size:12px;color:#9fb1a6}.conn.off{color:#ffb199}
main{padding:14px 12px 120px;max-width:1100px;margin:0 auto}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;text-align:left;min-height:92px;display:flex;flex-direction:column;gap:4px}
.tbl b{font-size:18px}.tbl small{color:var(--muted)}
.tbl.busy{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.p-nova{background:var(--warnbg);color:var(--warn)}.p-hotova{background:var(--okbg);color:var(--ok)}.p-vydana{background:var(--line);color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.back{background:#ffffff1f;color:#fff;padding:7px 12px}
.search{display:flex;gap:6px;margin-bottom:10px}.search input{flex:1;padding:12px 14px}.search button{background:var(--card);border:1px solid var(--line);padding:0 14px}
#micBtn.listening{background:var(--warn);color:#fff;border-color:var(--warn)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.cats button{background:var(--card);border:1px solid var(--line);padding:8px 14px;white-space:nowrap}
.cats button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;min-height:70px;position:relative}
.item span{display:block;color:var(--muted);font-size:14px}
.item .q{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border-radius:99px;min-width:24px;height:24px;font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.item .qwrap{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:2px}
.item .qwrap .q{position:static}
.item .qminus{width:15px;height:24px;border:none;background:transparent;color:var(--muted);font-size:15px;line-height:1;font-weight:900;padding:0;display:grid;place-items:center;cursor:pointer}
.cart{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 -6px 20px #0000001a}
.cart-in{max-width:1100px;margin:0 auto}
.row{display:flex;align-items:center;gap:8px}
.line{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .n{flex:1}.line .n small{display:block;color:var(--muted)}
.qb{width:34px;height:34px;background:var(--bg);font-weight:700;font-size:18px}
.line .qcol{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:26px}
.line .qcol b{font-size:16px;line-height:1.2}
.qmin{width:22px;height:18px;border:none;background:transparent;color:var(--muted);font-size:16px;line-height:1;font-weight:900;padding:0;display:grid;place-items:center;cursor:pointer}
.btn{background:var(--accent);color:#fff;padding:13px 16px;font-weight:700;width:100%}
.btn.ok{background:var(--ok)}.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.cart-list{max-height:34vh;overflow:auto;margin-bottom:8px}
.order{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.order.nova{border-color:var(--warn);box-shadow:inset 5px 0 0 var(--warn)}
.order.hotova{border-color:var(--ok);box-shadow:inset 5px 0 0 var(--ok)}
.order h3{margin:0;font-size:20px;display:flex;align-items:baseline;gap:8px}
.order h3 small{font-size:13px;color:var(--muted);font-weight:500;margin-left:auto}
.order ul{margin:0;padding:0;list-style:none}
.order li{padding:5px 0;font-size:18px;border-bottom:1px solid var(--line)}
.order li:last-child{border:0}
.order li b{display:inline-block;min-width:36px;color:var(--accent)}
.order li i{display:block;font-size:14px;color:var(--warn);margin-left:36px}
.note{background:var(--warnbg);color:var(--warn);padding:8px 10px;border-radius:8px;font-size:15px}
.bar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ready{position:sticky;top:106px;z-index:4;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.ready div{background:var(--ok);color:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:600;animation:pop .3s}
.ready div span{flex:1}
.ready button{background:#ffffff33;color:#fff;padding:8px 12px}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:12px 0 4px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.set-row{display:grid;grid-template-columns:1fr 90px 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.set-row.t{grid-template-columns:1fr auto}
.del{background:var(--warnbg);color:var(--warn);padding:10px 12px}
.login{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:20px}.login form{width:100%;max-width:360px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw}
.hide{display:none!important}
@media (max-width:560px){.set-row{grid-template-columns:1fr 70px;}.set-row .cat{grid-column:1}.set-row .del{grid-column:2}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <button id="backBtn" class="back hide">‹ Stoly</button>
    <h1 id="title">Objednávky</h1>
    <a href="index.html" class="back" style="text-decoration:none">📅 Smeny</a>
    <button id="boardTopBtn" class="back" onclick="showBoard=true;render()" title="Chýba / Kúpiť">📦</button>
    <button id="logoutTop" class="back" onclick="logout()" title="Odhlásiť toto zariadenie">⎋</button>
    <span id="conn" class="conn">●</span>
  </div>
  <nav class="tabs">
    <button data-role="casnik">Čašník</button>
    <button data-role="bar">Bar <span id="barDot" class="dot hide"></span></button>
    <button data-role="atrakcie">🎮 Atrakcie</button>
    <button data-role="uzavierka" id="tabUzavierka" class="hide">📊 Uzávierka</button>
    <button data-role="nastavenia" id="tabNastavenia" class="hide">Nastavenia</button>
  </nav>
</header>
<main id="app"></main>
<div id="cart" class="cart hide"></div>

<div id="employeeGate" class="login hide">
  <div class="card">
    <h2 style="margin-top:0">Kto si?</h2>
    <p class="muted" style="font-size:13px;margin:0 0 8px">Vyber sa zo zoznamu a zadaj svoj kód (rovnaký, aký máš aj vo Smenách).</p>
    <select id="gateName"></select>
    <input id="gatePin" type="password" inputmode="numeric" placeholder="Tvoj kód" autocomplete="off" onkeydown="if(event.key==='Enter')confirmGateLogin()">
    <div id="gateErr" style="color:var(--warn);min-height:20px"></div>
    <button class="btn" onclick="confirmGateLogin()">Pokračovať</button>
    <p style="text-align:center;margin-top:14px"><a href="#" onclick="wantManagerLogin=true;render();return false" style="font-size:13px">Prihlásiť ako vedúci</a></p>
  </div>
</div>
<div id="login" class="login hide"><form onsubmit="login(event)" class="card">
  <h2 style="margin-top:0">Prihlásenie vedúceho</h2>
  <input id="lmail" type="email" placeholder="E-mail" autocomplete="username" required>
  <input id="lpass" type="password" placeholder="Heslo" autocomplete="current-password" required>
  <div id="lerr" style="color:var(--warn);min-height:20px"></div>
  <button class="btn">Prihlásiť</button>
  <p style="text-align:center;margin-top:14px"><a href="#" onclick="backToGate();return false" style="font-size:13px">← Späť</a></p>
  </form></div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script>
// Rovnaký Firebase projekt ako appka na smeny (index.html) - jedna databáza pre obe.
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyB-2HeoePKrcsdawvI1LCOTQ6vWjibItpU",
  authDomain: "chillpoint-smeny-350c4.firebaseapp.com",
  databaseURL: "https://chillpoint-smeny-350c4-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "chillpoint-smeny-350c4",
  storageBucket: "chillpoint-smeny-350c4.firebasestorage.app",
  messagingSenderId: "251580957782",
  appId: "1:251580957782:web:801f838e4cd65abb4027f7"
};
</script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',') + ' €';
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };

let S = { tables: [], menu: [], orders: [], categories: [], employees: [], access: {}, queue: [], attractions: [], sessions: [], board: [] };
let role = store.get('role', 'casnik');
let tableId = null;          // otvorený stôl (čašník)
let view = 'order';          // 'order' | 'bill'
let cat = null;
let cart = [];               // [{menuId, qty, note}]
let cartOpen = false;        // košík dole je predvolene zbalený, aby neprekážal pri hľadaní
let acctOpen = false;        // "Účet stola" (zoznam už objednaného) je predvolene zbalený
let billSel = {};            // { "názov|cena": počet kusov, čo sa platí teraz } - na rozdelenie účtu
let orderNote = '';
let q = '';                  // hľadanie v menu
// Nastavenia (stoly/menu) smie meniť len vedúci - rovnaký účet ako v appke na smeny.
const MANAGER_EMAIL = 'vedouci@chillpoint-smeny.sk';
let isManager = false;
// Spoločný "zariadenie" účet - appka sa ním prihlási do Firebase automaticky na pozadí, aby zamestnanci
// nemuseli poznať žiadny e-mail/heslo. Oni sa potom identifikujú len svojím menom + PIN kódom (rovnaký
// kód, aký majú aj vo Smenách). Tento účet treba raz vytvoriť vo Firebase konzole (Authentication → Users
// → Add user) presne s týmto e-mailom a heslom.
const DEVICE_EMAIL = 'zariadenie@chillpoint-smeny.sk';
const DEVICE_PASSWORD = 'CP-PcZtW5wlmH9xuY';
let wantManagerLogin = false;   // true = zobraziť pôvodný formulár na prihlásenie vedúceho (e-mail/heslo)
let deviceLoginFailed = false;  // automatické prihlásenie zariadenia zlyhalo (účet ešte nie je vo Firebase vytvorený)
let deviceLoginAttempted = false;
let uzavierkaUnlocked = false;   // niekto iný ako vedúci si toto zariadenie odomkol PIN-om pre Dennú uzávierku
let uzavDate = new Date();   // deň zobrazený v Dennej uzávierke
let showHist = false;        // história platieb podľa dátumu, dostupná pre všetkých čašníkov (nielen vedúceho)
let histDate = new Date();
let showQueue = false;       // poradovník (napr. na biliard) - kto je ďalší na rade
let showQueueHist = false;   // história poradovníka (kto čakal, ako dlho, či bol odbavený) - dostupné pre všetkých
let showQuickCash = false;   // rýchla platba - len suma do tržby, bez viazania na stôl/položku
let queueHistDate = new Date();
// Nástenka "Chýba / Kúpiť" - zdieľaná s appkou Smeny (rovnaká Firebase), dostupná pre všetkých z hlavičky
let showBoard = false;
let boardType = 'missing';
let warnedReservations = new Set();  // rezervácie, na ktoré sa už píplo (aby to nepípalo dookola)
let histFilter = '';         // hľadanie v histórii platieb (meno stola, položka, číslo objednávky)
let queueHistFilter = '';    // hľadanie v histórii rezervácií (meno)
let payroll = store.get('payroll', { pct: '', days: {} });  // výplatná kalkulačka v uzávierke: % z tržby + odpracované hodiny za deň
// ochrana pred starým tvarom uložených dát v localStorage (zo staršej verzie appky) - inak by Uzávierka spadla na chybe
if (!payroll || typeof payroll !== 'object') payroll = { pct: '', days: {} };
if (!payroll.days || typeof payroll.days !== 'object') payroll.days = {};
if (payroll.pct === undefined || payroll.pct === null) payroll.pct = '';
if (!Array.isArray(payroll.noPctItems)) payroll.noPctItems = [...(Array.isArray(payroll.noPctCategories) ? payroll.noPctCategories : [])];  // konkrétne položky (napr. Pixel), z ktorých sa personálu neráta % z tržby
let sound = store.get('sound', true);
let seenReady = new Set(store.get('seenReady', []));

// ---------- Firebase (dáta sa ukladajú do Firebase Realtime Database) ----------
if (!window.FIREBASE_CONFIG || String(window.FIREBASE_CONFIG.apiKey || '').includes('SEM')) {
  document.body.innerHTML = '<div class="empty" style="padding:60px 20px">Chýba nastavenie Firebase.<br>Vyplňte súbor <b>firebase-config.js</b> podľa návodu.</div>';
  throw new Error('config');
}
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth = firebase.auth(), db = firebase.database();
const now = () => Date.now();
const str = (v, max = 100) => String(v ?? '').trim().slice(0, max);
const num = v => Math.round(Number(String(v ?? '').replace(',', '.')) * 100) / 100;
function fail(msg) { toast(msg); throw new Error(msg); }

// Rovnaké rozhranie ako pri verzii so serverom, len namiesto servera sa zapisuje do Firebase
async function call(method, url, body = {}) {
  try { return await callInner(method, url.split('/').filter(Boolean).slice(1), body); }
  catch (e) { if (e.code) toast('Chyba: ' + (e.code.includes('permission') ? 'nemáte prístup' : e.message)); throw e; }
}
async function callInner(m, [col, id, action], body) {
  if (col === 'tables') {
    if (m === 'POST' && !id) { if (!isManager) fail('Stoly smie pridávať len vedúci');
      const name = str(body.name, 40); if (!name) fail('Chýba názov stola');
      const rec = { name, order: now() };
      if (body.group !== undefined) rec.group = str(body.group, 10);
      if (body.color !== undefined) rec.color = str(body.color, 20);
      return db.ref('tables').push(rec); }
    const t = S.tables.find(x => x.id === id); if (!t) fail('Stôl neexistuje');
    if (m === 'PUT') { if (!isManager) fail('Stoly smie meniť len vedúci');
      const u = {};
      if (body.name !== undefined) { const name = str(body.name, 40); if (name) u.name = name; }
      if (body.color !== undefined) u.color = str(body.color, 20);
      if (body.group !== undefined) u.group = str(body.group, 10);
      return db.ref('tables/' + id).update(u); }
    if (m === 'DELETE') { if (!isManager) fail('Stoly smie mazať len vedúci');
      if (tableOrders(id).length) fail('Stôl má nezaplatené objednávky'); return db.ref('tables/' + id).remove(); }
    // Rozdelenie platby: zaplatí sa len zadaný počet kusov z každej položky, zvyšok ostane na stole otvorený.
    if (m === 'POST' && action === 'paySome') {
      const need = {};
      (body.items || []).forEach(i => { const k = i.name + '|' + i.price; need[k] = (need[k] || 0) + Math.max(0, i.qty | 0); });
      const os = tableOrders(id).sort((a, b) => a.createdAt - b.createdAt);
      const u = {}; const paidItems = [];
      os.forEach(o => {
        let changed = false;
        const items = o.items.map(it => {
          const k = it.name + '|' + it.price; const take = Math.min(need[k] || 0, it.qty);
          if (take > 0) { need[k] -= take; changed = true;
            paidItems.push({ menuId: it.menuId, name: it.name, price: it.price, qty: take, note: it.note || '', ...(it.cat ? { cat: it.cat } : {}) });
            return { ...it, qty: it.qty - take }; }
          return it;
        }).filter(it => it.qty > 0);
        if (changed) {
          u[o.id + '/items'] = items;
          if (!items.length) { u[o.id + '/status'] = 'zaplatena'; u[o.id + '/paidAt'] = now(); }
        }
      });
      if (!paidItems.length) fail('Nič na zaplatenie');
      const r = await db.ref('meta/lastNo').transaction(n => ((n || 0) % 999) + 1);
      const newKey = db.ref('orders').push().key;
      u[newKey] = { no: r.snapshot.val(), tableId: t.id, tableName: t.name, waiter: str(body.waiter, 30),
        note: '', items: paidItems, status: 'zaplatena', createdAt: now(), paidAt: now() };
      return db.ref('orders').update(u);
    }
    // Zmena poradia stola v zozname (v Nastaveniach) - preusporiada, nech vedúci môže dať stoly, ktoré k sebe patria, vedľa seba
    if (m === 'POST' && action === 'move') {
      if (!isManager) fail('Stoly smie meniť len vedúci');
      const idx = S.tables.findIndex(x => x.id === id); if (idx < 0) fail('Stôl neexistuje');
      const j = idx + (body.dir === 1 ? 1 : -1);
      if (j < 0 || j >= S.tables.length) return;
      const other = S.tables[j];
      const u = {};
      u[t.id + '/order'] = other.order; u[other.id + '/order'] = t.order;
      return db.ref('tables').update(u);
    }
    // Presun celého otvoreného účtu na iný stôl (napr. keď si hostia presadnú)
    if (m === 'POST' && action === 'moveTo') {
      const target = S.tables.find(x => x.id === body.targetId); if (!target) fail('Cieľový stôl neexistuje');
      const os = tableOrders(id);
      if (!os.length) fail('Stôl nemá žiadne otvorené objednávky');
      const u = {};
      os.forEach(o => { u[o.id + '/tableId'] = target.id; u[o.id + '/tableName'] = target.name; });
      return db.ref('orders').update(u);
    }
  }
  if (col === 'access') {
    if (!isManager) fail('PIN pre uzávierku smie meniť len vedúci');
    if (m === 'PUT') return db.ref('access').update({ uzavierkaPin: str(body.uzavierkaPin, 12) });
  }
  if (col === 'menu') {
    if (!isManager) fail('Nastavenia menu smie meniť len vedúci');
    if (m === 'POST' && !id) { const name = str(body.name, 60), price = num(body.price);
      if (!name || !(price >= 0)) fail('Zadajte názov a cenu');
      return db.ref('menu').push({ name, price, category: str(body.category, 40) || 'Ostatné', order: now() }); }
    if (m === 'PUT') { const u = {};
      if (body.name !== undefined && str(body.name, 60)) u.name = str(body.name, 60);
      if (body.price !== undefined && num(body.price) >= 0) u.price = num(body.price);
      if (body.category !== undefined) u.category = str(body.category, 40) || 'Ostatné';
      if (body.fav !== undefined) u.fav = !!body.fav;
      // vlastná suma pri pridaní (napr. biliard) - namiesto pevnej ceny z menu sa v objednávke spýta presná suma
      if (body.customPrice !== undefined) u.customPrice = !!body.customPrice;
      return db.ref('menu/' + id).update(u); }
    if (m === 'DELETE') return db.ref('menu/' + id).remove();
  }
  if (col === 'categories') {
    if (!isManager) fail('Kategórie smie meniť len vedúci');
    if (m === 'POST' && !id) { const name = str(body.name, 40); if (!name) fail('Zadajte názov kategórie');
      if (S.categories.some(c => c.name.toLowerCase() === name.toLowerCase())) fail('Táto kategória už existuje');
      return db.ref('categories').push({ name }); }
    if (m === 'DELETE') {
      const name = decodeURIComponent(id);
      if (S.menu.some(mi => mi.category === name)) fail('Kategória sa používa v menu, najprv presuň alebo zmaž jej položky');
      const c = S.categories.find(x => x.name === name); return c && db.ref('categories/' + c.id).remove();
    }
  }
  if (col === 'orders') {
    if (m === 'POST' && !id) {
      const table = S.tables.find(t => t.id === body.tableId); if (!table) fail('Vyberte stôl');
      const items = body.items.map(i => { const mi = S.menu.find(x => x.id === i.menuId);
        if (!mi) return null;
        // pri položkách s vlastnou sumou (napr. biliard) smie klient poslať presnú cenu namiesto pevnej ceny z menu
        let price = mi.price;
        if (mi.customPrice && i.price !== undefined) { const p = num(i.price); if (p > 0 && p < 10000) price = Math.round(p * 100) / 100; }
        return { menuId: mi.id, name: mi.name, price, qty: Math.max(1, Math.min(99, i.qty | 0)), note: str(i.note, 80) };
      }).filter(Boolean);
      if (!items.length) fail('Objednávka je prázdna');
      const r = await db.ref('meta/lastNo').transaction(n => ((n || 0) % 999) + 1);
      // skipBar: rovno zapísané na účet stola bez posielania na bar (napr. položky, ktoré netreba pripraviť)
      const rec = { no: r.snapshot.val(), tableId: table.id, tableName: table.name,
        waiter: str(body.waiter, 30), note: str(body.note, 120), items, status: body.skipBar ? 'vydana' : 'nova', createdAt: now() };
      if (body.skipBar) rec.vydanaAt = now();
      return db.ref('orders').push(rec);
    }
    const o = S.orders.find(x => x.id === id); if (!o) fail('Objednávka neexistuje');
    if (m === 'POST' && action === 'status') return db.ref('orders/' + id).update({ status: body.status, [body.status + 'At']: now() });
    if (m === 'DELETE') {
      if (o.status === 'zaplatena') { if (!isManager) fail('Zaplatenú objednávku smie zmazať len vedúci'); return db.ref('orders/' + id).remove(); }
      return db.ref('orders/' + id).remove();
    }
  }
  // Rýchla platba do tržby bez viazania na konkrétny stôl či položku menu - napr. keď niekto rýchlo
  // zaplatí a netreba presne rozpisovať, čo to bolo, len sumu zapísať do kasy/tržby.
  if (col === 'quickcash') {
    if (m === 'POST' && !id) {
      const price = num(body.amount); if (!(price > 0)) fail('Zadaj sumu');
      const note = str(body.note, 60);
      const r = await db.ref('meta/lastNo').transaction(n => ((n || 0) % 999) + 1);
      return db.ref('orders').push({
        no: r.snapshot.val(), tableId: null, tableName: '💶 Rýchla platba',
        waiter: str(body.waiter, 30), note: '',
        items: [{ menuId: null, name: note || 'Rýchla platba', price, qty: 1, note: '', cat: 'Rýchla platba' }],
        status: 'zaplatena', createdAt: now(), paidAt: now()
      });
    }
  }
  // Poradovník (napr. na biliard, ping-pong) - kto čaká a kto je ďalší na rade
  if (col === 'queue') {
    if (m === 'POST' && !id) {
      const name = str(body.name, 40); if (!name) fail('Zadaj meno');
      const rec = { name, note: str(body.note, 60), type: str(body.type, 30), createdAt: now() };
      if (body.tableId) { const t = S.tables.find(x => x.id === body.tableId); if (t) rec.tableId = t.id; }
      // rezervácia na presný čas dnes (napr. 18:00) - ak sa nezadá, ide o bežný poradovník "teraz"
      if (body.time && /^([01]\d|2[0-3]):[0-5]\d$/.test(body.time)) {
        const [h, mi] = body.time.split(':').map(Number);
        const d = new Date(); d.setHours(h, mi, 0, 0);
        rec.reserveAt = d.getTime();
      }
      return db.ref('queue').push(rec);
    }
    if (m === 'DELETE') {
      // Pred odstránením sa zápis uloží do histórie poradovníka (kto čakal, ako dlho, či bol odbavený alebo zmazaný)
      const q = S.queue.find(x => x.id === id);
      if (q) {
        await db.ref('queueLog').push({
          name: q.name, type: q.type || '', tableId: q.tableId || null,
          createdAt: q.createdAt, endedAt: now(), action: (body && body.action === 'served') ? 'served' : 'removed'
        });
      }
      return db.ref('queue/' + id).remove();
    }
  }
  // Nástenka "Chýba / Kúpiť" - zdieľaná so smenami (rovnaká Firebase). Pridať smie každý prihlásený,
  // mazať iba vedúci (rovnaká istota ako pri iných zdieľaných zoznamoch v tejto appke).
  if (col === 'board') {
    if (m === 'POST' && !id) {
      const text = str(body.text, 120); if (!text) fail('Napíš, čo chýba alebo čo kúpiť');
      const type = body.type === 'buy' ? 'buy' : 'missing';
      const author = isManager ? 'Vedúci' : str(body.waiter, 30) || 'Čašník';
      const rec = { text, type, author, createdAt: now() };
      const qty = str(body.qty, 30); if (qty) rec.qty = qty;
      return db.ref('board').push(rec);
    }
    // Označenie "vybavené" (kúpené/doplnené) - nezmaže sa hneď, len sa preškrtne, aby bolo vidno, čo sa už
    // vyriešilo (napr. keď si nie ste istí, či to už niekto kúpil). Smie ktokoľvek prihlásený.
    if (m === 'PUT' && action === 'done') {
      const b = S.board.find(x => x.id === id); if (!b) fail('Položka neexistuje');
      return db.ref('board/' + id).update({ done: !!body.done, doneAt: body.done ? now() : null });
    }
    if (m === 'DELETE') { if (!isManager) fail('Mazať z nástenky smie len vedúci'); return db.ref('board/' + id).remove(); }
  }
  // Atrakcie (biliard, PlayStation, ping-pong, šípky, jazz dance...) - definície staníc, mení len vedúci
  if (col === 'attractions') {
    if (m === 'POST' && !id) { if (!isManager) fail('Atrakcie smie pridávať len vedúci');
      const name = str(body.name, 40); if (!name) fail('Chýba názov');
      return db.ref('attractions').push({ name, type: str(body.type, 30) || 'Ostatné', order: now() }); }
    if (m === 'PUT') { if (!isManager) fail('Atrakcie smie meniť len vedúci');
      const u = {};
      if (body.name !== undefined) { const name = str(body.name, 40); if (name) u.name = name; }
      if (body.type !== undefined) u.type = str(body.type, 30) || 'Ostatné';
      return db.ref('attractions/' + id).update(u); }
    if (m === 'DELETE') { if (!isManager) fail('Atrakcie smie mazať len vedúci');
      if (S.sessions.some(s => s.stationId === id)) fail('Stanica sa práve používa');
      return db.ref('attractions/' + id).remove(); }
  }
  // Sedenia (session) - kto práve hrá na danej stanici, od kedy. Ktokoľvek prihlásený smie spustiť/ukončiť.
  if (col === 'sessions') {
    if (m === 'POST' && !id) {
      const st = S.attractions.find(a => a.id === body.stationId); if (!st) fail('Stanica neexistuje');
      if (S.sessions.some(s => s.stationId === st.id)) fail('Stanica už hrá');
      // startedAt: umožňuje spustiť aj so spätným časom (napr. zabudlo sa zapísať a hrajú už od 9:00)
      const startedAt = (body.startedAt && num(body.startedAt) > 0 && num(body.startedAt) <= now()) ? num(body.startedAt) : now();
      const rec = { stationId: st.id, name: st.name, type: st.type, waiter: str(body.waiter, 30), startedAt };
      // Hru je možné spustiť aj rovno naviazanú na konkrétny stôl (z účtu stola) - pri ukončení sa tak vopred vie, kam pripísať
      if (body.tableId) { const t = S.tables.find(x => x.id === body.tableId); if (t) { rec.tableId = t.id; rec.tableName = t.name; } }
      return db.ref('sessions').push(rec);
    }
    if (m === 'DELETE' && action === 'finish') {
      const s = S.sessions.find(x => x.id === id); if (!s) fail('Sedenie neexistuje');
      const price = num(body.price); if (!(price >= 0)) fail('Zadaj sumu');
      // Ak je zadaný stôl, suma sa nezaplatí hneď, ale pripíše sa na otvorený účet stola (zaplatí sa neskôr spolu so zvyškom)
      let tbl = null;
      if (body.tableId) { tbl = S.tables.find(x => x.id === body.tableId); if (!tbl) fail('Stôl neexistuje'); }
      const r = await db.ref('meta/lastNo').transaction(n => ((n || 0) % 999) + 1);
      const newKey = db.ref('orders').push().key;
      const rec = {
        no: r.snapshot.val(), tableId: tbl ? tbl.id : null, tableName: tbl ? tbl.name : '🎮 ' + s.name, waiter: str(body.waiter, 30),
        note: body.durationText ? 'Trvanie: ' + str(body.durationText, 40) : '',
        items: [{ menuId: null, name: '🎮 ' + s.name, price, qty: 1, note: '', cat: s.type || 'Atrakcie' }],
        status: tbl ? 'vydana' : 'zaplatena', createdAt: s.startedAt
      };
      if (!tbl) rec.paidAt = now();
      await db.ref('orders/' + newKey).set(rec);
      return db.ref('sessions/' + id).remove();
    }
    if (m === 'DELETE') return db.ref('sessions/' + id).remove(); // zrušenie bez platby (omylom spustené)
  }
  fail('Neznáma akcia');
}

const list = obj => Object.entries(obj || {}).map(([id, v]) => ({ ...v, id }));
let prevStatus = null;   // na zistenie novej / hotovej objednávky (zvuk)
function onData(v) {
  v = v || {};
  S = { tables: list(v.tables).sort((a, b) => a.order - b.order),
        menu: list(v.menu).sort((a, b) => a.order - b.order),
        orders: list(v.orders).map(o => ({ ...o, items: o.items || [] })).sort((a, b) => a.createdAt - b.createdAt),
        categories: list(v.categories),
        employees: Array.isArray(v.employees) ? v.employees.filter(Boolean) : Object.values(v.employees || {}).filter(Boolean),
        access: v.access || {},
        // rezervácie s presným časom (reserveAt) sa zoradia podľa toho času, "bez času" (rovno teraz) podľa toho,
        // kedy boli zapísané - efektívny čas radenia je reserveAt, ak je zadaný, inak createdAt
        queue: list(v.queue).sort((a, b) => (a.reserveAt || a.createdAt) - (b.reserveAt || b.createdAt)),
        attractions: list(v.attractions).sort((a, b) => a.order - b.order),
        sessions: list(v.sessions).sort((a, b) => a.startedAt - b.startedAt),
        queueLog: list(v.queueLog).sort((a, b) => a.endedAt - b.endedAt),
        board: list(v.board).sort((a, b) => a.createdAt - b.createdAt) };
  const st = Object.fromEntries(S.orders.map(o => [o.id, o.status]));
  if (prevStatus) {
    if (role === 'bar' && S.orders.some(o => o.status === 'nova' && !prevStatus[o.id])) beep([880, 1320]);
    if (role === 'casnik' && S.orders.some(o => o.status === 'hotova' && prevStatus[o.id] && prevStatus[o.id] !== 'hotova')) beep([660, 990, 1320]);
  }
  prevStatus = st;
  safeRender();
}

// Pri prvom spustení nahrá menu z VRP2 (menu.json) a ukážkové stoly – len raz
async function seedIfEmpty() {
  const r = await db.ref('meta/seeded').transaction(s => s ? undefined : true);
  if (!r.committed) return;
  const menu = await fetch('menu.json').then(x => x.json());
  const um = {}; menu.forEach((m, i) => um[m.id] = { name: m.name, price: m.price, category: m.category, order: i });
  const ut = {}; ['Stôl 1', 'Stôl 2', 'Stôl 3', 'Stôl 4', 'Bar'].forEach((n, i) => ut['t' + (i + 1)] = { name: n, order: i });
  const uc = {}; [...new Set(menu.map(m => m.category))].forEach((c, i) => uc['c' + i] = { name: c });
  const attr = [
    ['7', 'Biliard'], ['8', 'Biliard'],
    ['Ping-pong', 'Ping-pong'],
    ['Vpredu', 'Šípky'], ['Pódium', 'Šípky'], ['1', 'Šípky'], ['2', 'Šípky'], ['3', 'Šípky'], ['4', 'Šípky'], ['5', 'Šípky'], ['6', 'Šípky'], ['7', 'Šípky'], ['Xbox', 'Šípky'],
    ['PlayStation', 'PlayStation'],
    ['Jazz dance', 'Jazz dance']
  ];
  const ua = {}; attr.forEach(([name, type], i) => ua['a' + i] = { name, type, order: i });
  // zvlášť pre menu, tables a categories (nie z koreňa), nech sa to nespolieha na spoločné pravidlá
  await Promise.all([ db.ref('menu').update(um), db.ref('tables').update(ut), db.ref('categories').update(uc), db.ref('attractions').update(ua) ]);
}
// Zaplatené objednávky staršie ako 30 dní sa odmažú
function prune() {
  const u = {}, limit = now() - 30 * 864e5;
  S.orders.forEach(o => { if (o.status === 'zaplatena' && o.paidAt < limit) u[o.id] = null; });
  if (Object.keys(u).length) db.ref('orders').update(u).catch(() => {});
  // vybavené položky z nástenky staršie ako 7 dní sa potichu zmažú (mazanie smie len vedúci, preto len tu)
  if (isManager) {
    const ub = {}, blimit = now() - 7 * 864e5;
    S.board.forEach(b => { if (b.done && b.doneAt && b.doneAt < blimit) ub[b.id] = null; });
    if (Object.keys(ub).length) db.ref('board').update(ub).catch(() => {});
  }
}

let listening = false;
// Databáza je zdieľaná so smenami, takže pravidlá povoľujú čítanie len po jednotlivých
// uzloch (tables/menu/orders), nie naraz z koreňa - preto samostatné listenery.
let live = { tables: null, menu: null, orders: null, categories: null, employees: null, access: null, queue: null, attractions: null, sessions: null, queueLog: null, board: null };
let pruned = false;
function tryRender() {
  if (live.tables === null || live.menu === null || live.orders === null || live.categories === null || live.employees === null || live.access === null || live.queue === null || live.attractions === null || live.sessions === null || live.queueLog === null || live.board === null) return;
  onData({ tables: live.tables, menu: live.menu, orders: live.orders, categories: live.categories, employees: live.employees, access: live.access, queue: live.queue, attractions: live.attractions, sessions: live.sessions, queueLog: live.queueLog, board: live.board });
  if (!pruned) { pruned = true; prune(); }
}
// Neskúša to znova dookola, ak to raz zlyhá (napr. spoločný účet ešte nie je vo Firebase vytvorený) -
// vtedy sa automaticky ponúkne prihlásenie vedúceho namiesto donekonečna opakovaných neúspešných pokusov.
async function attemptDeviceLogin() {
  deviceLoginAttempted = true;
  try { await auth.signInWithEmailAndPassword(DEVICE_EMAIL, DEVICE_PASSWORD); }
  catch (e) { deviceLoginFailed = true; wantManagerLogin = true; render(); }
}
function backToGate() {
  wantManagerLogin = false;
  if (!auth.currentUser) { deviceLoginAttempted = false; attemptDeviceLogin(); }
  render();
}
function connect() {
  db.ref('.info/connected').on('value', s => {
    $('#conn').className = s.val() ? 'conn' : 'conn off'; $('#conn').textContent = s.val() ? '● online' : '● offline';
  });
  auth.onAuthStateChanged(async user => {
    isManager = !!user && (user.email || '').toLowerCase() === MANAGER_EMAIL.toLowerCase();
    uzavierkaUnlocked = false;
    if (role === 'nastavenia' && !isManager) { role = 'casnik'; store.set('role', role); }
    if (role === 'uzavierka' && !isManager) { role = 'casnik'; store.set('role', role); }
    if (!user) {
      if (listening) { db.ref('tables').off(); db.ref('menu').off(); db.ref('orders').off(); db.ref('categories').off(); db.ref('employees/list').off(); db.ref('access').off(); db.ref('queue').off(); db.ref('attractions').off(); db.ref('sessions').off(); db.ref('queueLog').off(); db.ref('board').off(); listening = false; }
      live = { tables: null, menu: null, orders: null, categories: null, employees: null, access: null, queue: null, attractions: null, sessions: null, queueLog: null, board: null }; pruned = false;
      // Nikto nie je prihlásený - skús automaticky prihlásiť toto zariadenie na spoločný účet, nech
      // zamestnanec nemusí poznať žiadne heslo (identifikuje sa až potom menom + svojím kódom).
      if (!wantManagerLogin && !deviceLoginAttempted) attemptDeviceLogin();
      else render();
      return;
    }
    deviceLoginAttempted = false; deviceLoginFailed = false; wantManagerLogin = false;
    render();
    try { await seedIfEmpty(); } catch (e) { console.warn(e); }
    const errH = () => toast('Nemáte prístup k dátam – skontrolujte pravidlá databázy');
    db.ref('tables').on('value', s => { live.tables = s.val() || {}; tryRender(); }, errH);
    db.ref('menu').on('value', s => { live.menu = s.val() || {}; tryRender(); }, errH);
    db.ref('categories').on('value', s => { live.categories = s.val() || {}; tryRender(); }, errH);
    db.ref('orders').on('value', s => { live.orders = s.val() || {}; tryRender(); }, errH);
    db.ref('employees/list').on('value', s => { live.employees = s.val() || []; tryRender(); }, () => { live.employees = []; tryRender(); });
    db.ref('access').on('value', s => { live.access = s.val() || {}; tryRender(); }, () => { live.access = {}; tryRender(); });
    db.ref('queue').on('value', s => { live.queue = s.val() || {}; tryRender(); }, () => { live.queue = {}; tryRender(); errH(); });
    db.ref('attractions').on('value', s => { live.attractions = s.val() || {}; tryRender(); }, () => { live.attractions = {}; tryRender(); errH(); });
    db.ref('sessions').on('value', s => { live.sessions = s.val() || {}; tryRender(); }, () => { live.sessions = {}; tryRender(); errH(); });
    db.ref('queueLog').on('value', s => { live.queueLog = s.val() || {}; tryRender(); }, () => { live.queueLog = {}; tryRender(); errH(); });
    db.ref('board').on('value', s => { live.board = s.val() || {}; tryRender(); }, () => { live.board = {}; tryRender(); errH(); });
    listening = true;
  });
}

// Neprekresľovať, kým niekto píše do políčka (inak by stratil text)
let pending = false;
function safeRender() {
  if (document.activeElement?.tagName === 'INPUT') { pending = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => {

// ---------- zvuk ----------
let actx;
function beep(freqs) {
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.start(t); o.stop(t + 0.17);
    });
    navigator.vibrate?.(200);
  } catch {}
}
document.addEventListener('click', () => { if (actx?.state === 'suspended') actx.resume(); });

function toast(msg) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2200);
}
const ago = t => { const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? 'teraz' : m + ' min'; };
const open = () => S.orders.filter(o => o.status !== 'zaplatena');
const tableOrders = id => open().filter(o => o.tableId === id);
const sumOrders = os => os.reduce((s, o) => s + o.items.reduce((a, i) => a + i.price * i.qty, 0), 0);
const STAV = { nova: 'Na bare', hotova: 'Hotová – odniesť', vydana: 'Vydaná' };

// ---------- render ----------
function render() {
  // Prihlasovacie "brány": kým nie je nikto prihlásený (zariadenie ešte len skúša automatický vstup),
  // alebo kým vedúci chce zadať svoj e-mail/heslo, alebo kým bežný zamestnanec ešte nezadal svoje meno
  // + kód, zobrazí sa vždy len jedna z troch vrstiev nižšie (cez CSS position:fixed prekryjú celú appku).
  const user = auth.currentUser;
  const showManagerForm = wantManagerLogin && !isManager;
  const curWaiter = store.get('waiter', '');
  const waiterVerified = curWaiter && (S.employees || []).some(e => e.name === curWaiter);
  const showGate = !!user && !isManager && !showManagerForm && !waiterVerified;
  $('#login').classList.toggle('hide', !showManagerForm);
  $('#employeeGate').classList.toggle('hide', !showGate);
  if (showGate) {
    const sel = $('#gateName');
    if (sel && document.activeElement !== sel) {
      const names = (S.employees || []).map(e => e.name).sort((a, b) => a.localeCompare(b, 'sk'));
      sel.innerHTML = names.length ? names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('') : '<option value="">(žiadni zamestnanci)</option>';
    }
  }
  const canUzavierka = isManager || !!(S.access && S.access.uzavierkaPin);
  $('#tabNastavenia').classList.toggle('hide', !isManager);
  $('#tabUzavierka').classList.toggle('hide', !canUzavierka);
  const boardMissing = S.board.filter(b => b.type !== 'buy' && !b.done).length;
  $('#boardTopBtn').innerHTML = '📦' + (boardMissing ? `<span style="display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;margin-left:4px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;vertical-align:middle">${boardMissing}</span>` : '');
  if (role === 'nastavenia' && !isManager) { role = 'casnik'; store.set('role', role); }
  if (role === 'uzavierka' && !canUzavierka) { role = 'casnik'; store.set('role', role); }
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.role === role));
  $('#barDot').classList.toggle('hide', !open().some(o => o.status === 'nova'));
  const inTable = role === 'casnik' && tableId && S.tables.some(t => t.id === tableId);
  if (role === 'casnik' && tableId && !inTable) tableId = null;
  if (role !== 'casnik') { showHist = false; showQueue = false; showQuickCash = false; }
  if (role !== 'atrakcie') showQueueHist = false;
  if (inTable) { showHist = false; showQueue = false; showQuickCash = false; }
  $('#backBtn').classList.toggle('hide', !inTable && !showBoard);
  $('#backBtn').textContent = showBoard ? '‹ Späť' : '‹ Stoly';
  $('#cart').classList.add('hide');
  if (showBoard) { $('#title').textContent = 'Chýba / Kúpiť'; renderBoard(); return; }
  $('#title').textContent = inTable ? S.tables.find(t => t.id === tableId).name
    : (role === 'casnik' && showHist) ? 'História platieb'
    : (role === 'casnik' && showQueue) ? 'Rezervácie'
    : (role === 'atrakcie' && showQueueHist) ? 'História rezervácií'
    : { casnik: 'Stoly', bar: 'Bar – objednávky', atrakcie: 'Atrakcie', uzavierka: 'Denná uzávierka', nastavenia: 'Nastavenia' }[role];
  if (role === 'casnik') inTable ? (view === 'bill' ? renderBill() : renderTable()) : (showHist ? renderHistory() : showQueue ? renderQueue() : renderTables());
  else if (role === 'bar') renderBar();
  else if (role === 'atrakcie') showQueueHist ? renderQueueHistory() : renderAtrakcie();
  else if (role === 'uzavierka') renderUzavierka();
  else renderSettings();
}

function readyBanner() {
  const r = open().filter(o => o.status === 'hotova');
  if (!r.length) return '';
  return `<div class="ready">${r.map(o => `<div><span>${esc(o.tableName)} · #${o.no} je hotová</span>
    <button onclick="setStatus('${o.id}','vydana')">Odnesené</button></div>`).join('')}</div>`;
}

function tableTile(t) {
  const os = tableOrders(t.id);
  const st = os.some(o => o.status === 'hotova') ? '<span class="pill p-hotova">Hotové</span>'
           : os.some(o => o.status === 'nova') ? '<span class="pill p-nova">Na bare</span>' : '';
  return `<button class="tbl ${os.length ? 'busy' : ''}" style="${t.color ? `border-left:6px solid ${t.color}` : ''}" onclick="openTable('${t.id}')">
    <b>${esc(t.name)}</b>${os.length ? `<small>${eur(sumOrders(os))}</small>${st}` : '<small>voľný</small>'}</button>`;
}
function renderTables() {
  const groups = {};
  S.tables.forEach(t => { const g = t.group || ''; (groups[g] = groups[g] || []).push(t); });
  const names = Object.keys(groups).filter(g => g).sort((a, b) => a.localeCompare(b, 'sk'));
  if (groups['']) names.push('');
  const html = names.map(g => `
    ${g ? `<h2 style="margin-top:18px">${esc(g)}</h2>` : (names.length > 1 ? '<h2 style="margin-top:18px">Bez skupiny</h2>' : '')}
    <div class="grid">${groups[g].map(tableTile).join('')}</div>`).join('');
  const freeCount = S.tables.filter(t => !tableOrders(t.id).length).length;
  const busyCount = S.tables.length - freeCount;
  const summary = S.tables.length ? `<div class="row" style="gap:14px;margin-bottom:10px;font-size:14px">
    <span>🟢 ${freeCount} voľných</span><span>🔴 ${busyCount} obsadených</span></div>` : '';
  const topRow = `<div class="row" style="justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
    ${summary || '<span></span>'}
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <button class="btn ghost" style="width:auto" onclick="showQuickCash=!showQuickCash;render()">💶 Rýchla platba</button>
      <button class="btn ghost" style="width:auto" onclick="showQueue=true;render()">📌 Rezervácie${S.queue.length ? ' (' + S.queue.length + ')' : ''}</button>
      <button class="btn ghost" style="width:auto" onclick="showHist=true;render()">📅 História</button>
    </div></div>`;
  $('#app').innerHTML = readyBanner() + topRow + quickCashBlock() + (S.tables.length ? html
    : '<div class="empty">Zatiaľ žiadne stoly. Pridajte ich v Nastaveniach.</div>');
}
// Rýchla platba - keď treba len zapísať sumu do tržby (do kasy), bez toho aby sa rozpisovalo ku ktorému
// stolu alebo položke menu patrí (napr. rýchly hotovostný predaj mimo bežnej objednávky).
function quickCashBlock() {
  if (!showQuickCash) return '';
  return `<div class="card" style="margin-bottom:14px">
    <label class="muted" style="font-size:13px">Rýchla platba - suma sa pripočíta do dnešnej tržby, bez viazania na stôl</label>
    <div class="row" style="margin-top:6px;gap:8px">
      <input id="qcAmount" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="Suma €, napr. 11,30" style="max-width:160px">
      <input id="qcNote" placeholder="Poznámka (nepovinné)">
    </div>
    <button class="btn" style="margin-top:8px" onclick="addQuickCash()">Pridať do tržby</button>
  </div>`;
}
async function addQuickCash() {
  const amountStr = $('#qcAmount') ? $('#qcAmount').value : '';
  const amount = parseFloat(String(amountStr).replace(',', '.'));
  if (!(amount > 0)) return toast('Zadaj platnú sumu');
  const note = $('#qcNote') ? $('#qcNote').value.trim() : '';
  await call('POST', '/api/quickcash', { amount, note, waiter: store.get('waiter', '') });
  showQuickCash = false;
  toast('Pridané do tržby ✓');
  render();
}

// Nástenka "Chýba / Kúpiť" - zdieľaná s appkou Smeny (rovnaká Firebase). Vidí a pridáva každý prihlásený,
// mazať smie len vedúci.
function renderBoard() {
  const missing = S.board.filter(b => b.type !== 'buy' && !b.done);
  const buy = S.board.filter(b => b.type === 'buy' && !b.done);
  const done = S.board.filter(b => b.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const row = b => `<div class="line"><div class="n">${b.type === 'buy' ? '🛒' : '🧺'} <b>${esc(b.text)}</b>${b.qty ? ` · ${esc(b.qty)}` : ''}
      <small>${esc(b.author || '')}${b.createdAt ? ' · ' + ago(b.createdAt) : ''}</small></div>
      <div class="row" style="gap:4px">
        <button class="btn ok" style="width:auto;padding:6px 10px" onclick="toggleBoardDone('${b.id}',true)">${b.type === 'buy' ? '✓ Kúpené' : '✓ Doplnené'}</button>
        ${isManager ? `<button class="btn ghost" style="width:auto;padding:6px 10px" onclick="delBoardItem('${b.id}')">✕</button>` : ''}
      </div></div>`;
  const doneRow = b => `<div class="line" style="opacity:.55"><div class="n"><s>${b.type === 'buy' ? '🛒' : '🧺'} ${esc(b.text)}${b.qty ? ` · ${esc(b.qty)}` : ''}</s>
      <small>${esc(b.author || '')}</small></div>
      <div class="row" style="gap:4px">
        <button class="btn ghost" style="width:auto;padding:6px 10px" onclick="toggleBoardDone('${b.id}',false)">↺ Vrátiť</button>
        ${isManager ? `<button class="btn ghost" style="width:auto;padding:6px 10px" onclick="delBoardItem('${b.id}')">✕</button>` : ''}
      </div></div>`;
  $('#app').innerHTML = `
    <h2 style="margin-top:0">🧺 Chýba</h2>
    ${missing.length ? `<div class="card" style="padding:0">${missing.map(row).join('')}</div>` : '<div class="empty">Nič nechýba.</div>'}
    <h2>🛒 Kúpiť</h2>
    ${buy.length ? `<div class="card" style="padding:0">${buy.map(row).join('')}</div>` : '<div class="empty">Zatiaľ nič na kúpenie.</div>'}
    <div class="card" style="margin-top:14px">
      <label class="muted" style="font-size:13px">Nová položka</label>
      <input id="bText" placeholder="Napr. citrón" style="margin-top:6px">
      <input id="bQty" placeholder="Množstvo (nepovinné, napr. 2 kg)" style="margin-top:6px">
      <div class="row" style="margin-top:8px;gap:16px">
        <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="bType" value="missing" ${boardType === 'buy' ? '' : 'checked'} onchange="boardType='missing'"> 🧺 Chýba</label>
        <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="bType" value="buy" ${boardType === 'buy' ? 'checked' : ''} onchange="boardType='buy'"> 🛒 Kúpiť</label>
      </div>
      <button class="btn" style="margin-top:8px" onclick="addBoardItem()">Pridať</button>
    </div>
    ${done.length ? `<h2>Vybavené (posledných 7 dní)</h2><div class="card" style="padding:0">${done.map(doneRow).join('')}</div>` : ''}`;
}
async function toggleBoardDone(id, val) { await call('PUT', '/api/board/' + id + '/done', { done: val }); }
async function addBoardItem() {
  const text = $('#bText').value.trim(); if (!text) return toast('Napíš, čo chýba alebo čo kúpiť');
  const qty = $('#bQty') ? $('#bQty').value.trim() : '';
  await call('POST', '/api/board', { text, qty, type: boardType, waiter: store.get('waiter', '') });
  $('#bText').value = ''; if ($('#bQty')) $('#bQty').value = '';
  toast(boardType === 'buy' ? 'Pridané na nákupný zoznam 🛒' : 'Pridané - chýba 🧺');
}
async function delBoardItem(id) {
  if (!confirm('Zmazať túto položku z nástenky?')) return;
  await call('DELETE', '/api/board/' + id, {});
}

// Rezervácie - meno/číslo objednávky a čo presne je rezervované (konkrétny stôl, alebo atrakcia ako biliard,
// ping-pong a pod.). Dostupné pre všetkých čašníkov. Keď je vybraná atrakcia, zápis sa zároveň ukáže aj
// v poradovníku danej atrakcie na obrazovke Atrakcie (rovnaký záznam, len iný pohľad naň).
const queueTargetLabel = q => q.tableId ? (S.tables.find(t => t.id === q.tableId)?.name || '') : (q.type || '');
const fmtQTime = t => { const d = new Date(t); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function renderQueue() {
  const nowT = now();
  const rows = S.queue.map((q, i) => `<div class="line" style="align-items:center">
    <div class="n">${q.reserveAt ? `<b>${q.reserveAt > nowT ? '🕐 ' : '▶ '}${fmtQTime(q.reserveAt)}</b> ` : (i === 0 ? '<b>▶ Na rade:</b> ' : `<span class="muted">${i + 1}.</span> `)}${esc(q.name)}${queueTargetLabel(q) ? ` <small>· ${esc(queueTargetLabel(q))}</small>` : ''}${q.note ? `<small> · ${esc(q.note)}</small>` : ''}</div>
    <div class="row" style="gap:4px">
      <button class="btn ok" style="width:auto;padding:6px 10px" onclick="serveQueue('${q.id}')">Odbaviť ✓</button>
      <button class="btn ghost" style="width:auto;padding:6px 10px" onclick="delQueue('${q.id}')">✕</button>
    </div>
  </div>`).join('');
  const attrTypes = [...new Set(S.attractions.map(a => a.type || 'Ostatné'))].sort((a, b) => a.localeCompare(b, 'sk'));
  $('#app').innerHTML = `
    ${S.queue.length ? `<div class="card" style="padding:0">${rows}</div>` : '<div class="empty">Zatiaľ žiadne rezervácie.</div>'}
    <div class="card" style="margin-top:14px">
      <label class="muted" style="font-size:13px">Nová rezervácia</label>
      <input id="qName" placeholder="Meno / číslo objednávky" style="margin-top:6px">
      <select id="qTarget" style="margin-top:6px">
        <option value="">Čo je rezervované? (voliteľné)</option>
        ${S.tables.length ? `<optgroup label="Stôl">${S.tables.map(t => `<option value="table:${t.id}">${esc(t.name)}</option>`).join('')}</optgroup>` : ''}
        ${attrTypes.length ? `<optgroup label="Atrakcia">${attrTypes.map(t => `<option value="attr:${esc(t)}">${esc(t)}</option>`).join('')}</optgroup>` : ''}
      </select>
      <label class="muted" style="font-size:13px;margin-top:6px;display:block">Na presný čas (voliteľné - keď sa nezadá, ide rovno "teraz")</label>
      <input id="qTime" type="time" style="margin-top:4px">
      <input id="qNote" placeholder="Poznámka (nepovinné)" style="margin-top:6px">
      <button class="btn" style="margin-top:8px" onclick="addQueue()">Pridať</button>
    </div>
    <button class="btn ghost" style="margin-top:14px;width:100%" onclick="showQueue=false;render()">← Späť na stoly</button>`;
}
async function addQueue() {
  const name = $('#qName').value.trim(); if (!name) return toast('Zadaj meno');
  const targetVal = $('#qTarget') ? $('#qTarget').value : '';
  const body = { name, note: $('#qNote').value.trim() };
  if (targetVal.startsWith('table:')) { const t = S.tables.find(x => x.id === targetVal.slice(6)); if (t) body.tableId = t.id; }
  else if (targetVal.startsWith('attr:')) { body.type = targetVal.slice(5); }
  const time = $('#qTime') ? $('#qTime').value : '';
  if (time) body.time = time;
  await call('POST', '/api/queue', body);
  $('#qName').value = ''; $('#qNote').value = ''; if ($('#qTarget')) $('#qTarget').value = ''; if ($('#qTime')) $('#qTime').value = '';
}
// Zámok proti omylom - aj odbavenie sa musí potvrdiť (predtým sa dalo omylom zmazať jedným klikom)
async function serveQueue(id) {
  const q = S.queue.find(x => x.id === id);
  if (!confirm(`Odbaviť${q ? ` "${q.name}"` : ''}? Rezervácia sa odstráni zo zoznamu.`)) return;
  await call('DELETE', '/api/queue/' + id, { action: 'served' });
  toast('Odbavené ✓');
}
async function delQueue(id) {
  const q = S.queue.find(x => x.id === id);
  if (!confirm(`Odstrániť${q ? ` "${q.name}"` : ''} z rezervácií?`)) return;
  await call('DELETE', '/api/queue/' + id, { action: 'removed' });
}

// Atrakcie (biliard, PlayStation, ping-pong, šípky, jazz dance...) - stanice sa označia ako "hrá"
// bez ceny, cena sa zapíše ručne až pri ukončení. Dostupné pre všetkých čašníkov.
const fmtDur = ms => {
  const min = Math.floor(ms / 60000);
  const h = Math.floor(min / 60), m = min % 60;
  return h ? `${h} h ${m} min` : `${m} min`;
};
const slug = s => String(s).replace(/[^a-zA-Z0-9]/g, '_');
let finishSessionId = null;   // id sedenia, ktoré sa práve ukončuje (zobrazí inline formulár so sumou)
let queueFormType = null;     // typ atrakcie, pre ktorý je otvorený formulár "+ Rezervácia"
let startFormStation = null;  // id stanice, pre ktorú je otvorený formulár na spustenie hry (výber času)
let addAttrToTableOpen = false; // v účte stola - formulár na pridanie/spustenie atrakcie priamo na tento stôl
// Inline formulár na ukončenie hry - suma + či ide rovno do kasy alebo sa pripíše na účet konkrétneho stola.
// Ak bola hra spustená priamo z účtu stola, ten stôl je vopred predvybraný.
function sessionFinishBlock(s) {
  const sid = slug(s.id);
  return `<input id="finPrice-${sid}" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Suma €" style="margin-top:2px">
    <select id="finTable-${sid}" style="margin-top:2px">
      <option value="">💶 Zaplatiť hneď (hotovosť)</option>
      ${S.tables.map(tb => `<option value="${tb.id}" ${tb.id === s.tableId ? 'selected' : ''}>🧾 Pripísať na účet: ${esc(tb.name)}</option>`).join('')}
    </select>
    <div class="row" style="gap:6px;margin-top:2px;flex-wrap:wrap">
      <button class="btn ok" style="width:auto;padding:6px 10px;font-size:13px" onclick="event.stopPropagation();confirmFinishSession('${s.id}')">Potvrdiť</button>
      <button class="btn ghost" style="width:auto;padding:6px 10px;font-size:13px" onclick="event.stopPropagation();confirmFinishSession('${s.id}',true)">🔁 Potvrdiť a spustiť znova</button>
      <button class="btn ghost" style="width:auto;padding:6px 10px;font-size:13px" onclick="event.stopPropagation();finishSessionId=null;render()">Zrušiť</button>
    </div>`;
}
// Inline formulár na spustenie hry - buď "teraz", alebo vlastný čas (napr. keď sa zabudlo zapísať a hrajú už od 9).
function sessionStartBlock(stationId, tableId) {
  const sid = slug(stationId + '_' + (tableId || ''));
  const tArg = tableId ? `'${tableId}'` : 'null';
  return `<select id="stMode-${sid}" style="margin-top:2px" onchange="$('#stCustom-${sid}').style.display=this.value==='custom'?'block':'none'">
      <option value="now">🕐 Teraz</option>
      <option value="custom">✎ Iný čas (napr. zabudol som zapísať)</option>
    </select>
    <input id="stCustom-${sid}" type="time" style="margin-top:2px;display:none">
    <div class="row" style="gap:6px;margin-top:2px;flex-wrap:wrap">
      <button class="btn ok" style="width:auto;padding:6px 10px;font-size:13px" onclick="event.stopPropagation();confirmStartSession('${stationId}',${tArg},'${sid}')">Spustiť</button>
      <button class="btn ghost" style="width:auto;padding:6px 10px;font-size:13px" onclick="event.stopPropagation();startFormStation=null;render()">Zrušiť</button>
    </div>`;
}
function stationTile(st) {
  const s = S.sessions.find(x => x.stationId === st.id);
  if (!s) {
    if (startFormStation === st.id) {
      return `<div class="tbl" style="display:flex;flex-direction:column;gap:6px;text-align:left;cursor:default">
        <b>${esc(st.name)}</b><small>voľná</small>${sessionStartBlock(st.id, null)}</div>`;
    }
    return `<button class="tbl" onclick="startFormStation='${st.id}';render()"><b>${esc(st.name)}</b><small>voľná</small></button>`;
  }
  if (finishSessionId === s.id) {
    return `<div class="tbl busy" style="display:flex;flex-direction:column;gap:6px;text-align:left;cursor:default">
      <b>${esc(st.name)}</b><small>odohraté ${fmtDur(now() - s.startedAt)}</small>${sessionFinishBlock(s)}</div>`;
  }
  return `<div class="tbl busy" style="display:flex;flex-direction:column;gap:6px;text-align:left;cursor:default">
    <b>${esc(st.name)}</b><small>hrá · ${fmtDur(now() - s.startedAt)}</small>
    <div class="row" style="gap:6px;margin-top:4px">
      <button class="btn ok" style="width:auto;padding:6px 10px;font-size:13px" onclick="event.stopPropagation();finishSessionId='${s.id}';render()">Ukončiť</button>
      <button class="btn ghost" style="width:auto;padding:6px 10px;font-size:13px" onclick="event.stopPropagation();cancelSession('${s.id}')">Zrušiť</button>
    </div></div>`;
}
function stationQueueBlock(type) {
  const rows = S.queue.filter(q => q.type === type);
  if (!rows.length) return '';
  return `<div class="card" style="padding:0;margin-top:8px">${rows.map((q, i) => `<div class="line" style="align-items:center">
    <div class="n">${i === 0 ? '<b>▶ Na rade:</b> ' : `<span class="muted">${i + 1}.</span> `}${esc(q.name)}${q.note ? `<small> · ${esc(q.note)}</small>` : ''}</div>
    ${i === 0 ? `<button class="btn ok" style="width:auto" onclick="serveQueue('${q.id}')">Odbaviť ✓</button>`
               : `<button class="btn ghost" style="width:auto;padding:6px 10px" onclick="delQueue('${q.id}')">✕</button>`}
  </div>`).join('')}</div>`;
}
function queueFormBlock(type) {
  if (queueFormType !== type) return '';
  const tid = slug(type);
  return `<div class="card" style="margin-top:8px">
    <label class="muted" style="font-size:13px">Nová rezervácia – ${esc(type)}</label>
    <select id="qfTable-${tid}" style="margin-top:6px">
      <option value="">— vyber stôl —</option>
      ${S.tables.map(tb => `<option value="${tb.id}">${esc(tb.name)}</option>`).join('')}
    </select>
    <input id="qfName-${tid}" placeholder="alebo napíš meno (ak nesedí k žiadnemu stolu)" style="margin-top:6px">
    <button class="btn" style="margin-top:8px" onclick="addStationQueue('${esc(type).replace(/'/g, "\\'")}')">Pridať</button>
  </div>`;
}
function renderAtrakcie() {
  const groups = {};
  S.attractions.forEach(a => { (groups[a.type || 'Ostatné'] = groups[a.type || 'Ostatné'] || []).push(a); });
  const types = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'sk'));
  const topRow = `<div class="row" style="justify-content:flex-end;margin-bottom:6px">
    <button class="btn ghost" style="width:auto;padding:8px 12px" onclick="showQueueHist=true;render()">📜 História rezervácií</button></div>`;
  const html = types.map(t => `
    <h2 style="margin-top:18px">${esc(t)}</h2>
    <div class="grid">${groups[t].map(stationTile).join('')}</div>
    <div class="row" style="justify-content:flex-end;margin-top:6px">
      <button class="btn ghost" style="width:auto;padding:6px 10px;font-size:13px" onclick="queueFormType=(queueFormType==='${esc(t).replace(/'/g, "\\'")}'?null:'${esc(t).replace(/'/g, "\\'")}');render()">📌 + Rezervácia (${esc(t)})</button>
    </div>
    ${queueFormBlock(t)}
    ${stationQueueBlock(t)}`).join('');
  $('#app').innerHTML = topRow + (types.length ? html : '<div class="empty">Zatiaľ žiadne atrakcie. Pridajte ich v Nastaveniach.</div>');
}
// História poradovníka podľa dátumu - kto čakal, ako dlho a či bol odbavený alebo zmazaný. Dostupné pre všetkých čašníkov.
function renderQueueHistory() {
  const wasFocused = document.activeElement && document.activeElement.id === 'queueHistFilterInput';
  const selPos = wasFocused ? document.activeElement.selectionStart : null;

// Spustí novú hru - buď od teraz, alebo od zadaného vlastného času (napr. keď sa zabudlo zapísať pri štarte).
async function doStartSession(stationId, tableId, mode, timeVal) {
  let startedAt = now();
  if (mode === 'custom') {
    if (!timeVal) { toast('Zadaj čas'); return false; }
    const [h, mnt] = timeVal.split(':').map(Number);
    const d = new Date(); d.setHours(h, mnt, 0, 0);
    if (d.getTime() > now()) d.setDate(d.getDate() - 1); // zadaný čas je v budúcnosti (napr. tesne po polnoci) - berieme včerajší deň
    startedAt = d.getTime();
  }
  const body = { stationId, waiter: store.get('waiter', ''), startedAt };
  if (tableId) body.tableId = tableId;
  await call('POST', '/api/sessions', body);
  return true;
}
async function confirmStartSession(stationId, tableId, sid) {
  const mode = $('#stMode-' + sid) ? $('#stMode-' + sid).value : 'now';
  const timeVal = $('#stCustom-' + sid) ? $('#stCustom-' + sid).value : '';
  let ok = false;
  try { ok = await doStartSession(stationId, tableId, mode, timeVal); } catch (e) { return; }
  if (!ok) return;
  startFormStation = null;
  toast('Hra spustená ✓');
  render();
}
async function confirmStartOnTable(tableId) {
  const tsid = slug(tableId);
  const pick = $('#attrPick-' + tsid);
  const stationId = pick ? pick.value : '';
  if (!stationId) return toast('Vyber atrakciu');
  const mode = $('#attrMode-' + tsid) ? $('#attrMode-' + tsid).value : 'now';
  const timeVal = $('#attrCustom-' + tsid) ? $('#attrCustom-' + tsid).value : '';
  let ok = false;

  addAttrToTableOpen = false;

}
async function confirmFinishSession(id, restart) {
  const s = S.sessions.find(x => x.id === id); if (!s) return;
  const sid = slug(id);
  const priceStr = $('#finPrice-' + sid) ? $('#finPrice-' + sid).value : '';
  const price = parseFloat(String(priceStr).replace(',', '.'));
  if (!(price >= 0)) return toast('Zadaj platnú sumu');
  const tableSel = $('#finTable-' + sid);
  const targetTableId = tableSel ? tableSel.value : '';
  await call('DELETE', '/api/sessions/' + id + '/finish', {
    price, waiter: store.get('waiter', ''), durationText: fmtDur(now() - s.startedAt), tableId: targetTableId || null
  });
  finishSessionId = null;
  toast(targetTableId ? 'Pripísané na účet stola ✓' : 'Zaplatené ✓');
  // Rýchle opakované spustenie - hneď po ukončení naskočí nová hra na tej istej stanici (šetrí klikanie pri stálych hráčoch)
  if (restart) {
    try { await call('POST', '/api/sessions', { stationId: s.stationId, waiter: store.get('waiter', '') }); toast('Nová hra spustená ✓'); }
    catch (e) { /* napr. stanicu medzitým spustil niekto iný - toast o chybe už dal call() */ }
  }
  render();
}

// odstráni diakritiku, aby "kofola" našlo aj "Kófola" a "cierny" aj "čierny"
const fold = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

// ---------- diktovanie objednávky hlasom (Android/Chrome - Web Speech API) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const hasVoice = !!SR;
const NUM_WORDS = { jeden: 1, jedna: 1, jedno: 1, dva: 2, dve: 2, dvaja: 2, tri: 3, styri: 4, styria: 4, pat: 5, sest: 6, sedem: 7, osem: 8, devat: 9, desat: 10 };
// slovenčina skloňuje koncovky ("pivo"/"pivá", "vodka"/"vodky") - porovnávame slová bez poslednej hlásky
const stem = w => w.length > 3 ? w.slice(0, -1) : w;
const wordMatch = (a, b) => stem(a) === stem(b) || a.includes(b) || b.includes(a);
function startVoiceOrder() {
  if (!SR) return toast('Rozpoznávanie hlasu tento prehliadač nepodporuje');
  const btn = $('#micBtn');
  const rec = new SR();
  rec.lang = 'sk-SK'; rec.interimResults = false; rec.maxAlternatives = 1;
  if (btn) { btn.classList.add('listening'); btn.textContent = '🎤…'; }
  rec.onresult = e => applyVoiceOrder(e.results[0][0].transcript);
  rec.onerror = () => toast('Nerozumel som, skús znova');
  rec.onend = () => { if (btn) { btn.classList.remove('listening'); btn.textContent = '🎤'; } };
  try { rec.start(); } catch { toast('Mikrofón sa nepodarilo spustiť'); }
}
// Rozdelí nadiktovaný text na časti (počet + názov položky) a pridá zhody do košíka.
// Nič sa neposiela automaticky - výsledok si čašník pred odoslaním skontroluje v košíku.
function applyVoiceOrder(text) {
  const heard = (text || '').trim();
  if (!heard) return;
  const parts = heard.split(/,| a (?=\d|\p{L})/giu).map(s => s.trim()).filter(Boolean);
  const added = [], unmatched = [];
  parts.forEach(part => {
    const words = fold(part).split(/\s+/).filter(Boolean);
    let qty = 1;
    if (/^\d+$/.test(words[0])) { qty = Math.max(1, parseInt(words[0], 10)); words.shift(); }
    else if (words[0] in NUM_WORDS) { qty = NUM_WORDS[words[0]]; words.shift(); }
    const rest = words.join(' ');
    if (!rest) { unmatched.push(part); return; }
    let match = S.menu.find(m => {
      const nameWords = fold(m.name).split(/\s+/).filter(Boolean);
      return nameWords.every(nw => words.some(w => wordMatch(nw, w)));
    });
    if (!match) match = S.menu.find(m => fold(m.name).includes(rest) || rest.includes(fold(m.name)));
    if (match) {
      // položky s vlastnou sumou (napr. biliard) sa hlasom nedajú pridať - suma sa musí zadať ručne cez dlaždicu
      if (match.customPrice) { unmatched.push(`${match.name} (má vlastnú sumu, pridaj ručne)`); return; }
      const c = cart.find(x => x.menuId === match.id && !x.note && x.price == null);
      c ? c.qty += qty : cart.push({ menuId: match.id, qty, note: '' });
      added.push(`${qty}× ${match.name}`);
    } else unmatched.push(part);
  });
  if (added.length) { renderItems(); renderFavs(); renderCart(); }
  const msg = (added.length ? 'Pridané: ' + added.join(', ') : '') +
              (added.length && unmatched.length ? ' · ' : '') +
              (unmatched.length ? 'Nerozpoznané: „' + unmatched.join(', ') + '“' : '');
  toast(msg || ('Počul som: „' + heard + '“, ale nič som nenašiel'));
}

function renderItems() {
  const el = $('#items'); if (!el) return;
  const words = fold(q.trim()).split(/\s+/).filter(Boolean);
  const list = words.length ? S.menu.filter(m => words.every(w => fold(m.name).includes(w))).slice(0, 60)
                            : S.menu.filter(m => m.category === cat);
  $('#cats').classList.toggle('hide', words.length > 0);
  const qty = id => cart.filter(c => c.menuId === id).reduce((a, c) => a + c.qty, 0);

function renderFavs() {
  const el = $('#favs'); if (!el) return;
  const favs = S.menu.filter(m => m.fav);
  if (!favs.length) { el.innerHTML = ''; return; }
  const qty = id => cart.filter(c => c.menuId === id).reduce((a, c) => a + c.qty, 0);
  el.innerHTML = `<h3 style="margin:0 0 6px">⭐ Obľúbené</h3><div class="items">${favs.map(m => `
    <button class="item" onclick="addItem('${m.id}')"><b>${esc(m.name)}</b><span>${m.customPrice ? '✎ vlastná suma' : eur(m.price)}</span>
    ${qty(m.id) ? `<div class="qwrap"><div class="q">${qty(m.id)}</div><button class="qminus" onclick="event.stopPropagation();removeItem('${m.id}')">−</button></div>` : ''}</button>`).join('')}</div>`;
}
function addItem(id) {
  const mi = S.menu.find(x => x.id === id);
  // položky ako biliard majú premenlivú sumu - namiesto pevnej ceny sa spýta presná suma, nech sa
  // nemusí prácne vyťukávať cez pevné položky (napr. 7,10 €)
  if (mi && mi.customPrice) return addCustomPriceItem(id);
  const c = cart.find(x => x.menuId === id && !x.note && x.price == null);
  c ? c.qty++ : cart.push({ menuId: id, qty: 1, note: '' });
  renderItems(); renderFavs(); renderCart();
}
function addCustomPriceItem(id) {
  const mi = S.menu.find(x => x.id === id); if (!mi) return;
  const raw = prompt(`Zadaj presnú sumu za "${mi.name}" (€):`, '');
  if (raw === null) return;
  const price = num(raw);
  if (!(price > 0)) return toast('Zadaj platnú sumu väčšiu ako 0');
  cart.push({ menuId: id, qty: 1, note: '', price: Math.round(price * 100) / 100 });
  renderItems(); renderFavs(); renderCart();
}
// Odoberie 1 kus danej položky z košíka priamo z dlaždice (bez potreby otvárať košík dole)
function removeItem(id) {
  // hľadá od konca - pri položkách s vlastnou sumou (napr. biliard) tak odoberie naposledy pridanú
  let idx = -1;
  for (let i = cart.length - 1; i >= 0; i--) { if (cart[i].menuId === id && !cart[i].note) { idx = i; break; } }
  if (idx === -1) return;
  const c = cart[idx];
  if (c.price != null) cart.splice(idx, 1);
  else { c.qty--; if (c.qty <= 0) cart.splice(idx, 1); }
  renderItems(); renderFavs(); renderCart();
}
function changeQty(i, d) { cart[i].qty += d; if (cart[i].qty < 1) cart.splice(i, 1); render(); }
function setNote(i) {
  const n = prompt('Poznámka k položke (napr. bez ľadu):', cart[i].note);
  if (n !== null) { cart[i].note = n.trim(); render(); }
}

function renderCart() {
  const el = $('#cart');
  if (!cart.length) { el.classList.add('hide'); cartOpen = false; return; }
  el.classList.remove('hide');
  const m = id => S.menu.find(x => x.id === id) || { name: '?', price: 0 };
  // položky s vlastnou sumou (napr. biliard) majú cenu uloženú priamo na riadku v košíku (c.price), inak sa berie z menu
  const linePrice = c => c.price != null ? c.price : m(c.menuId).price;
  const total = cart.reduce((a, c) => a + linePrice(c) * c.qty, 0);
  const count = cart.reduce((a, c) => a + c.qty, 0);
  if (!cartOpen) {
    el.innerHTML = `<div class="cart-in"><button class="btn" style="display:flex;justify-content:space-between;align-items:center" onclick="cartOpen=true;renderCart()">
      <span>🛒 ${count} ${count === 1 ? 'položka' : (count < 5 ? 'položky' : 'položiek')}</span><span>${eur(total)} · zobraziť ▲</span></button></div>`;
    return;
  }
  el.innerHTML = `<div class="cart-in">
    <button class="btn ghost" style="margin-bottom:8px;width:100%" onclick="cartOpen=false;renderCart()">Skryť ▼</button>
    <div class="cart-list">${cart.map((c, i) => `
    <div class="line"><div class="n">${esc(m(c.menuId).name)}${c.price != null ? ` · <b>${eur(c.price)}</b>` : ''}
      <small onclick="setNote(${i})" style="cursor:pointer">${c.note ? '✎ ' + esc(c.note) : '+ poznámka'}</small></div>
      <div class="qcol"><b>${c.qty}</b><button class="qmin" onclick="changeQty(${i},-1)">−</button></div>
      <button class="qb" onclick="changeQty(${i},1)">+</button></div>`).join('')}</div>
    <input id="onote" placeholder="Poznámka k objednávke (nepovinné)" value="${esc(orderNote)}" oninput="orderNote=this.value" style="margin-bottom:8px">
    <div style="display:grid;gap:6px">
      <button class="btn" id="sendBtn" onclick="sendOrder()">📤 Odoslať na bar · ${eur(total)}</button>
      <button class="btn ghost" id="writeBtn" onclick="writeOrder()">📝 Len zapísať do účtu (bez baru) · ${eur(total)}</button>
    </div></div>`;
}

async function sendOrder() {
  $('#sendBtn').disabled = true;
  try {
    await call('POST', '/api/orders', { tableId, items: cart, note: orderNote, waiter: store.get('waiter', '') });
    cart = []; orderNote = ''; toast('Odoslané na bar ✓'); render();
  } catch { $('#sendBtn') && ($('#sendBtn').disabled = false); }
}
// Zapíše položky rovno do účtu stola bez toho, aby prešli cez bar (napr. keď sa netreba pripravovať)
async function writeOrder() {
  $('#writeBtn').disabled = true;
  try {
    await call('POST', '/api/orders', { tableId, items: cart, note: orderNote, waiter: store.get('waiter', ''), skipBar: true });
    cart = []; orderNote = ''; toast('Zapísané do účtu ✓'); render();
  } catch { $('#writeBtn') && ($('#writeBtn').disabled = false); }
}
async function setStatus(id, status) { await call('POST', `/api/orders/${id}/status`, { status }); }
async function cancelOrder(id) { if (confirm('Zrušiť túto objednávku?')) await call('DELETE', `/api/orders/${id}`); }
async function moveTable() {
  const sel = $('#moveSel'); if (!sel) return;
  const targetId = sel.value;
  const target = S.tables.find(t => t.id === targetId); if (!target) return;
  if (!confirm(`Presunúť celý účet na "${target.name}"?`)) return;
  await call('POST', `/api/tables/${tableId}/moveTo`, { targetId });
  tableId = targetId; toast('Účet presunutý ✓'); render();
}

function renderBill() {
  const os = tableOrders(tableId);
  const agg = {};
  os.forEach(o => o.items.forEach(i => {
    const k = i.name + '|' + i.price;
    agg[k] = agg[k] || { name: i.name, price: i.price, qty: 0 }; agg[k].qty += i.qty;
  }));
  const rows = Object.values(agg);
  // výber na "platbu po častiach" začína na nule - klikaním na položku sa pridáva po 1 kuse
  const keys = new Set(rows.map(r => r.name + '|' + r.price));
  Object.keys(billSel).forEach(k => { if (!keys.has(k)) delete billSel[k]; });
  rows.forEach(r => { const k = r.name + '|' + r.price; billSel[k] = Math.min(billSel[k] || 0, r.qty); });
  const allTotal = sumOrders(os);
  const selTotal = rows.reduce((s, r) => s + r.price * (billSel[r.name + '|' + r.price] || 0), 0);
  const anySel = selTotal > 0;
  $('#app').innerHTML = `<div class="card"><div class="total"><span>Celý účet</span><span>${eur(allTotal)}</span></div></div>
    ${rows.length ? `<button class="btn ok" style="margin-top:10px" onclick="payAll()">💶 Zaplatiť celý účet naraz · ${eur(allTotal)}</button>` : ''}
    ${rows.length ? `
    <h2 style="margin-top:22px">Alebo platba po častiach - klikaj na položky</h2>
    <p class="muted" style="margin:0 0 10px">Každé kliknutie pridá 1 kus do platby teraz. Kliknutím na číslo na položke ho o 1 uberieš.</p>
    <div class="items">${rows.map(r => { const k = r.name + '|' + r.price; const sel = billSel[k] || 0; return `
      <button class="item" style="${sel >= r.qty ? 'opacity:.55' : ''}" onclick="billTap('${k.replace(/'/g, "\\'")}',${r.qty})">
        <b>${esc(r.name)}</b><span>${eur(r.price)} · na účte ${r.qty}×</span>
        ${sel ? `<div class="q" onclick="event.stopPropagation();billMinus('${k.replace(/'/g, "\\'")}')">${sel}</div>` : ''}
      </button>`; }).join('')}</div>
    <div class="card" style="margin-top:10px"><div class="total"><span>Na platbu teraz</span><span>${eur(selTotal)}</span></div></div>
    <div style="display:grid;gap:8px;margin-top:10px">
      <button class="btn ${anySel ? 'ok' : 'ghost'}" onclick="payItems()" ${anySel ? '' : 'disabled'}>Zaplatiť vybrané · ${eur(selTotal)}</button>
      ${anySel ? `<button class="btn ghost" onclick="billSel={};render()">Vynulovať výber</button>` : ''}
    </div>` : '<div class="empty">Stôl nemá žiadne otvorené objednávky.</div>'}
    <button class="btn ghost" style="margin-top:14px" onclick="view='order';render()">Späť na objednávanie</button>`;
}
function billTap(k, max) { if ((billSel[k] || 0) >= max) return; billSel[k] = (billSel[k] || 0) + 1; render(); }
function billMinus(k) { billSel[k] = Math.max(0, (billSel[k] || 0) - 1); render(); }
async function payAll() {
  const os = tableOrders(tableId);
  if (!os.length) return;
  if (!confirm('Označiť stôl ako zaplatený? Objednávky sa uzavrú.')) return;
  const agg = {};
  os.forEach(o => o.items.forEach(i => { const k = i.name + '|' + i.price; agg[k] = agg[k] || { name: i.name, price: i.price, qty: 0 }; agg[k].qty += i.qty; }));
  const items = Object.values(agg);
  await call('POST', `/api/tables/${tableId}/paySome`, { items, waiter: store.get('waiter', '') });
  billSel = {}; tableId = null; toast('Stôl uzavretý ✓'); render();
}
async function payItems() {
  const items = Object.entries(billSel).filter(([, q]) => q > 0).map(([k, q]) => {
    const i = k.lastIndexOf('|'); return { name: k.slice(0, i), price: Number(k.slice(i + 1)), qty: q };
  });
  if (!items.length) return;
  const os = tableOrders(tableId);
  const allTotal = sumOrders(os);
  const selTotal = items.reduce((s, i) => s + i.price * i.qty, 0);
  const isAll = Math.abs(selTotal - allTotal) < 0.005;
  if (!confirm(isAll ? 'Označiť stôl ako zaplatený? Objednávky sa uzavrú.' : `Označiť vybrané položky (${eur(selTotal)}) ako zaplatené? Zvyšok účtu ostane na stole otvorený.`)) return;
  await call('POST', `/api/tables/${tableId}/paySome`, { items, waiter: store.get('waiter', '') });
  billSel = {};
  if (isAll) { tableId = null; toast('Stôl uzavretý ✓'); } else toast('Zaplatené ✓');
  render();
}
