function savePayroll() { store.set('payroll', payroll); }
function dayPaidOrders(date) {
  const dayStart = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
  const dayEnd = dayStart + 86400000;
  return S.orders.filter(o => o.status === 'zaplatena' && o.paidAt >= dayStart && o.paidAt < dayEnd);
}
// Tržba rozpočítaná po jednotlivých položkách (podľa názvu) - na výpočet, koľko z toho je vylúčené z percent
// (konkrétna položka, napr. len "Pixel", nie celá kategória "Hry"), aj pre CSV export.
function itemRevenue(paidOrders) {
  const byItem = {};
  paidOrders.forEach(o => o.items.forEach(i => { byItem[i.name] = (byItem[i.name] || 0) + i.price * i.qty; }));
  return byItem;
}
// Základ pre výpočet percent = tržba mínus konkrétne položky, z ktorých si personál percentá neberie (napr. Pixel)
function pctBaseFor(paidOrders, total) {
  const byItem = itemRevenue(paidOrders);
  const noPctSet = new Set(payroll.noPctItems || []);
  const excludedRevenue = Object.entries(byItem).filter(([name]) => noPctSet.has(name)).reduce((s, [, v]) => s + v, 0);
  return { pctBase: Math.max(0, total - excludedRevenue), excludedRevenue };
}
function toggleNoPctItem(name, on) {
  const set = new Set(payroll.noPctItems || []);
  if (on) set.add(name); else set.delete(name);
  payroll.noPctItems = [...set];
  savePayroll(); render();
}
function recomputePayroll() {
  const paidToday = dayPaidOrders(uzavDate);
  const total = sumOrders(paidToday);
  const dayHours = payroll.days[payDayKey()] || {};
  const pct = num(payroll.pct) || 0;
  const { pctBase, excludedRevenue } = pctBaseFor(paidToday, total);
  const pctAmount = pctBase * pct / 100;
  const checkedNames = Object.keys(dayHours);
  const splitShare = checkedNames.length ? pctAmount / checkedNames.length : 0;
  const hourlyTotal = (S.employees || []).reduce((s, e) => s + (num(dayHours[e.name]) || 0) * (e.wage || 0), 0);
  if ($('#payHourly')) $('#payHourly').textContent = eur(hourlyTotal);
  if ($('#payPct')) $('#payPct').textContent = eur(pctAmount);
  if ($('#payPctLabel')) $('#payPctLabel').textContent = `Percentá z tržby (${pct}%${excludedRevenue > 0 ? ', základ ' + eur(pctBase) : ''})`;
  if ($('#payGrand')) $('#payGrand').textContent = eur(hourlyTotal + pctAmount);
  (S.employees || []).forEach((e, i) => {
    if (!(e.name in dayHours)) return;
    const hourly = (num(dayHours[e.name]) || 0) * (e.wage || 0), empTotal = hourly + splitShare;
    const note = $('#payEmpNote-' + i);
    if (note) note.innerHTML = `hodinovka ${eur(hourly)} + podiel z tržby ${eur(splitShare)} = <b id="payEmpTotal-${i}">${eur(empTotal)}</b>`;
  });
}
function togglePayrollEmp(name, on) {
  const k = payDayKey(); payroll.days[k] = payroll.days[k] || {};
  if (on) payroll.days[k][name] = payroll.days[k][name] || ''; else delete payroll.days[k][name];
  savePayroll(); render();
}
function setPayrollHours(name, val) {
  const k = payDayKey(); payroll.days[k] = payroll.days[k] || {};
  payroll.days[k][name] = val; savePayroll(); recomputePayroll();
}
function setPayrollPct(val) { payroll.pct = val; savePayroll(); recomputePayroll(); }
// Stiahne výplatný prehľad za daný deň ako CSV (otvorí sa priamo v Exceli). Bodkočiarka ako oddeľovač
// a BOM na začiatku, nech Excel v slovenčine správne rozpozná kódovanie aj oddeľovač stĺpcov.
function downloadPayrollCsv() {
  const paidToday = dayPaidOrders(uzavDate);
  const total = sumOrders(paidToday);
  const dayHours = payroll.days[payDayKey()] || {};
  const pct = num(payroll.pct) || 0;
  const { pctBase, excludedRevenue } = pctBaseFor(paidToday, total);
  const pctAmount = pctBase * pct / 100;
  const checkedNames = Object.keys(dayHours);
  const splitShare = checkedNames.length ? pctAmount / checkedNames.length : 0;
  let hourlyTotal = 0;
  const rows = [['Meno', 'Odpracované hodiny', 'Hodinovka €/h', 'Hodinovka spolu €', 'Podiel z tržby €', 'Spolu €']];
  (S.employees || []).forEach(e => {
    if (!(e.name in dayHours)) return;
    const h = num(dayHours[e.name]) || 0;
    const hourly = h * (e.wage || 0);
    hourlyTotal += hourly;
    rows.push([e.name, h, e.wage || 0, hourly.toFixed(2), splitShare.toFixed(2), (hourly + splitShare).toFixed(2)]);
  });
  rows.push([]);
  rows.push(['Tržba za deň €', total.toFixed(2)]);
  if (excludedRevenue > 0) rows.push(['z toho bez percent (' + (payroll.noPctItems || []).join(', ') + ') €', excludedRevenue.toFixed(2)]);
  rows.push(['Základ pre percentá €', pctBase.toFixed(2)]);
  rows.push(['Percentá %', pct]);
  rows.push(['Percentá spolu €', pctAmount.toFixed(2)]);
  rows.push(['Hodinovky spolu €', hourlyTotal.toFixed(2)]);
  rows.push(['Výplaty spolu €', (hourlyTotal + pctAmount).toFixed(2)]);
  const esc2 = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + rows.map(r => r.map(esc2).join(';')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `vyplaty_${payDayKey()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
async function delPaidOrder(id) {
  if (!confirm('Zmazať túto platbu z uzávierky? Toto nastálo odstráni záznam.')) return;

function allCategories() {
  const set = new Set(S.categories.map(c => c.name));
  S.menu.forEach(m => set.add(m.category));
  return [...set].sort((a, b) => a.localeCompare(b, 'sk'));
}

async function delAttraction(id) { if (confirm('Zmazať túto atrakciu?')) await call('DELETE', '/api/attractions/' + id); }
async function addTable() { const v = $('#newT').value.trim(); if (v) await call('POST', '/api/tables', { name: v }); }

async function moveTableOrder(id, dir) { await call('POST', '/api/tables/' + id + '/move', { dir }); }
async function quickAddTable() {
  const g = $('#qaGroup').value.trim(), n = $('#qaNum').value.trim();
  if (!g || !n) return toast('Zadaj skupinu aj číslo');
  const existing = S.tables.find(t => (t.group || '') === g && t.color);
  await call('POST', '/api/tables', { name: g + n, group: g, color: existing ? existing.color : '' });
  $('#qaNum').value = '';
}
async function setEmployeeWage(name, wage) {
  if (!isManager) return;
  const list = (S.employees || []).map(e => e.name === name ? { ...e, wage: num(wage) || 0 } : e);
  try { await db.ref('employees/list').set(list); } catch (e) { toast('Chyba: nemáte prístup k mzdám'); }
}
async function saveUzavierkaPin() {

async function clearUzavierkaPin() {

async function addItemMenu() {

async function delItem(id) { if (confirm('Zmazať položku z menu?')) await call('DELETE', '/api/menu/' + id); }

let gateLoginFails = 0;
function confirmGateLogin() {
  const err = $('#gateErr');
  const lockUntil = Number(localStorage.getItem('cp_gate_lockuntil') || 0);
  if (Date.now() < lockUntil) { if (err) err.textContent = `Príliš veľa pokusov. Skús to o ${Math.ceil((lockUntil - Date.now()) / 1000)} s.`; return; }
  const name = $('#gateName')?.value || '';
  const pin = ($('#gatePin')?.value || '').trim();
  if (!name) { if (err) err.textContent = 'Vyber svoje meno'; return; }
  if (!pin) { if (err) err.textContent = 'Zadaj svoj kód'; return; }
  const emp = (S.employees || []).find(e => e.name === name);
  if (!emp || !emp.code || String(emp.code) !== pin) {
    gateLoginFails++;
    if (gateLoginFails >= 5) { gateLoginFails = 0; localStorage.setItem('cp_gate_lockuntil', String(Date.now() + 60000)); if (err) err.textContent = 'Príliš veľa pokusov. Skús to o minútu.'; return; }
    if (err) err.textContent = 'Nesprávny kód';
    return;
  }
  gateLoginFails = 0;
  if (err) err.textContent = '';
  store.set('waiter', name);
  toast('Prihlásený ako ' + name + ' ✓');
  render();
}

// ---------- upozornenie na blížiacu sa rezerváciu ----------
function checkReservationReminders() {
  if (!S.queue || !S.queue.length) return;
  const t = Date.now();
  S.queue.forEach(q => {
    if (!q.reserveAt) return;
    const diff = q.reserveAt - t;
    // pípne raz, keď do rezervácie ostáva 10 až 0 minút (a ešte neprešla)
    if (diff <= 10 * 60000 && diff > -60000 && !warnedReservations.has(q.id)) {
      warnedReservations.add(q.id);
      beep([880, 660, 880]);
      toast(`🕐 Rezervácia ${q.name} o ${fmtQTime(q.reserveAt)}`);
    }
  });
  // upratať staré id, nech Set nerastie donekonečna
  if (warnedReservations.size > 200) {
    const ids = new Set(S.queue.map(q => q.id));
    warnedReservations.forEach(id => { if (!ids.has(id)) warnedReservations.delete(id); });
  }
}
setInterval(checkReservationReminders, 20000);

connect();
