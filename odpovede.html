<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Odpovede na e-maily · ChillPoint</title>
  <meta name="theme-color" content="#0a0c0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://chillpoint-smeny-350c4-default-rtdb.europe-west1.firebasedatabase.app">
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
  <style>
    :root{--yellow:#f5bb16;--black:#0a0c0f;--panel:#17191d;--line:#34373c;--muted:#a7a9ad;--white:#fff;--red:#ff6c6c;--green:#5fd67a;--blue:#6fb3ff}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;overflow-x:clip}
    body:has(.ov){overflow:hidden}
    .wrap{width:min(820px,100% - 24px);margin:0 auto;padding:14px 0 40px}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
    .top a{color:var(--yellow);text-decoration:none;font-weight:700;font-size:14px}
    h1{font-size:22px;margin:0;flex:1;text-transform:uppercase;min-width:220px}
    h2{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:18px 0 8px;text-transform:uppercase}
    .card{background:var(--panel);border:1px solid var(--line);padding:14px;margin-bottom:10px}
    .btn{background:var(--yellow);color:#111;border:0;font:inherit;font-weight:800;padding:11px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;font-size:14px}
    .btn.sm{padding:7px 10px;font-size:12px}
    .btn.ghost{background:transparent;color:var(--white);border:1px solid var(--line)}
    .btn.red{background:transparent;color:var(--red);border:1px solid #7a3434}
    .btn:disabled{opacity:.5;cursor:default}
    input,select,textarea{width:100%;background:#0d0f11;color:#fff;border:1px solid #55585c;padding:10px;font:inherit;font-size:16px;margin-bottom:8px}
    textarea{min-height:80px;resize:vertical;line-height:1.45}
    textarea.big{min-height:200px}
    textarea[readonly]{background:#111316;border-color:#3d4045}
    label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
    .seg{display:flex;border:1px solid var(--line);margin-bottom:10px}
    .seg button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;padding:10px 8px;cursor:pointer}
    .seg button.on{background:var(--yellow);color:#111;font-weight:800}
    .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
    .tabs button{flex:1;min-width:110px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font:inherit;font-size:14px;padding:10px;cursor:pointer}
    .tabs button.on{border-color:var(--yellow);color:var(--yellow);font-weight:800}
    .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .step{font-size:12px;letter-spacing:.1em;color:var(--yellow);text-transform:uppercase;font-weight:800;margin:0 0 8px}
    .picks{display:grid;gap:6px}
    .pk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#0d0f11;border:1px solid var(--line);border-left:5px solid var(--blue);color:#fff;font:inherit;font-size:15px;padding:10px 12px;cursor:pointer}
    .pk small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    .pk.on{border-color:var(--yellow);background:#2a2410}
    .pk.sug{border-left-color:var(--green)}
    .pk .tag{background:var(--green);color:#111;font-size:11px;font-weight:900;padding:2px 6px;white-space:nowrap}
    .pk .tx{flex:1;min-width:0}
    .fl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:4px 10px;align-items:center}
    .fl label{font-size:14px;font-weight:700;padding-bottom:8px}
    .fl label small{display:block;font-weight:400;color:var(--green);font-size:11px}
    @media(max-width:520px){.fl{grid-template-columns:minmax(0,1fr)}.fl label{padding-bottom:0}}
    .tp{border-left:5px solid var(--blue);cursor:pointer}
    .tp h3{margin:0 0 4px;font-size:16px}
    .tp p{margin:0;font-size:13px;color:var(--muted);line-height:1.4;white-space:pre-wrap;max-height:3.6em;overflow:hidden}
    .tp .when{color:#d9c88a;margin-bottom:4px}
    .ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:5;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(12px,env(safe-area-inset-top)) 10px 30px}
    .box{background:var(--panel);border:1px solid var(--yellow);width:min(680px,100%);padding:16px;position:relative}
    .box .x{position:sticky;top:0;float:right;background:#26292d;border:1px solid var(--line);color:#fff;font-size:18px;width:36px;height:36px;cursor:pointer;margin:-6px -6px 0 8px}
    .box h3{margin:0 0 12px;font-size:18px}
    .empty{color:var(--muted);font-size:14px;padding:6px 0}
    .err{color:var(--red);font-size:13px;min-height:18px;font-weight:700}
    .warn{background:#2a2410;border:1px solid #6b5a1a;color:#ffd66b;font-size:13px;padding:10px;margin-bottom:10px;line-height:1.45}
    .hint{font-size:12px;color:var(--muted);margin:-4px 0 8px;line-height:1.45}
    footer{color:var(--muted);font-size:11px;opacity:.6;text-align:center;margin-top:28px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--yellow);color:#111;font-weight:700;padding:10px 16px;z-index:9;max-width:90vw}
  </style>
</head>
<body>
  <div class="wrap" id="app"><p class="empty">Načítavam…</p></div>
  <script>
  // ===== ✉️ ODPOVEDE NA E-MAILY (2026-10-26, od 2026-10-27 BEZ umelej inteligencie – zadarmo) =====
  // Uložené hotové odpovede (šablóny). Zamestnanec vloží e-mail zákazníka → appka podľa slov v e-maile navrhne
  // šablónu (⭐), ukáže políčka pre miesta v [HRANATÝCH ZÁTVORKÁCH] (meno, počet detí, dátum…), niektoré predvyplní
  // z e-mailu a poskladá hotovú odpoveď na skopírovanie. Nič sa neodosiela a nič to nestojí.
  // Kto ju vidí: vedúci vždy; zamestnanci až keď vedúci v ⚙ Nastavenia prepne „👥 Aj zamestnanci“
  // (settings/hubAccess/odpAll) a človek nemá na úvode v Prístupoch odškrtnuté „✉️ Odpovede“.
  // Dáta: ai/templates/<id> = {title, when?, text, by, createdAt, updatedAt} (pravidlá Firebase „ai“: číta vedúci,
  // pri odpAll aj zariadenie; pridávať/upravovať smie aj zariadenie pri odpAll, mazať len vedúci).
  const MANAGER_EMAIL = 'vedouci@chillpoint-smeny.sk';
  // zdieľané zariadenie (ako na úvode a v Rezerváciách) – aby zamestnanci mohli čítať šablóny
  const DEVICE_EMAIL = 'zariadenie@chillpoint-smeny.sk', DEVICE_PASSWORD = 'CP-PcZtW5wlmH9xuY';
  const LIM = { title: 80, when: 300, text: 6000, mail: 20000, val: 300 };

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
  const blurNow = () => { try { document.activeElement && document.activeElement.blur(); } catch (e) {} };
  // bez diakritiky a malými písmenami (na porovnávanie slov)
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  let authReady = false, isMgr = false, authUser = null, hubAccess = null;
  let tpls = {}, loaded = false, loadErr = '';
  const VIEWS = ['reply', 'tpl', 'set'];
  let view = VIEWS.includes(ls.get('cp_odpView')) ? ls.get('cp_odpView') : 'reply';
  // rozpísané veci držíme v premenných (nie v DOM) → živé prekreslenie ich nevymaže
  let mail = '', pickId = '', vals = {}, guess = {};
  let tf = null;          // formulár šablóny {id?, title, when, text}
  let busyAct = false;

  // ---- kto smie ----
  const myName = () => ls.get('cp_viewAs') || ls.get('cp_myname') || '';
  const odpAll = () => !!(hubAccess && hubAccess.odpAll);
  function staffAllowed() {
    const n = myName();
    if (!n || !odpAll()) return false;
    const enc = encodeURIComponent(n).replace(/\./g, '%2E');
    return !(hubAccess.e && hubAccess.e[enc] && hubAccess.e[enc].odpovede === false);
  }
  const canUse = () => isMgr || (!!authUser && staffAllowed());
  const whoAmI = () => isMgr ? 'Vedúci' : (myName() || 'Vedúci');
  async function setOdpAll(on) {
    if (!isMgr || busyAct) return; busyAct = true;
    try { await firebase.database().ref('settings/hubAccess/odpAll').set(on ? true : null); toast(on ? '👥 Odpovede teraz vidia aj zamestnanci' : '🔒 Odpovede vidí len vedúci'); }
    catch (e) { toast('Nepodarilo sa uložiť (len vedúci).'); }
    busyAct = false;
  }
  function setView(v) { blurNow(); view = v; ls.set('cp_odpView', v); render(); }

  const tplList = () => Object.entries(tpls || {}).map(([id, t]) => ({ id, ...t })).filter(t => t && typeof t.text === 'string' && t.text.trim())
    .sort((a, b) => (a.title || '').localeCompare(b.title || '', 'sk'));

  // ---- miesta na doplnenie: [MENO], [POČET DETÍ]… (v poradí, ako sú v texte, každé raz) ----
  const PH = /\[([^\[\]\n]{1,40})\]/g;
  function fieldsOf(text) {
    const out = [];
    String(text || '').replace(PH, (m, k) => { const key = k.trim(); if (key && !out.includes(key)) out.push(key); return m; });
    return out;
  }
  function fillText(text) {
    return String(text || '').replace(PH, (m, k) => { const v = (vals[k.trim()] || '').trim(); return v || m; });
  }

  // ---- ⭐ návrh šablóny podľa slov v e-maile ----
  // slová porovnávame podľa prvých 5 písmen bez diakritiky (oslava / oslavu / oslavy = to isté)
  const STOP = new Set(['dobry', 'dakuj', 'pozdr', 'chcel', 'chcem', 'chcer', 'chcet', 'bolo', 'bude', 'budem', 'mozno', 'mohli', 'vasej', 'vasho', 'vasu', 'nasej', 'nasho', 'prosi', 'ktory', 'ktora', 'ktore', 'alebo', 'tento', 'tieto', 'takze', 'tiez', 'velmi', 'chill', 'point', 'chillp', 'arena', 'laser', 'trnav']);
  const stems = s => new Set((norm(s).match(/[a-z]{4,}/g) || []).map(w => w.slice(0, 5)).filter(w => !STOP.has(w)));
  function scoreTpl(t, mailStems) {
    let sc = 0;
    const head = stems((t.title || '') + ' ' + (t.when || '')), body = stems(String(t.text || '').replace(PH, ' '));
    head.forEach(w => { if (mailStems.has(w)) sc += 3; });
    body.forEach(w => { if (!head.has(w) && mailStems.has(w)) sc += 1; });
    return sc;
  }
  function ranked() {
    const list = tplList();
    if (!mail.trim()) return list.map(t => ({ ...t, sc: 0 }));
    const ms = stems(mail);
    return list.map(t => ({ ...t, sc: scoreTpl(t, ms) })).sort((a, b) => b.sc - a.sc || (a.title || '').localeCompare(b.title || '', 'sk'));
  }

  // ---- predvyplnenie z e-mailu (len návrh – zamestnanec skontroluje) ----
  const NUM_WORDS = '(?:det[ií]|deti|dieta|dieťa|hr[aá][čc]|os[oô]b|ludi|ľud[ií]|lid[ií]|ziak|žiak|ucastn|účastn|kamar)';
  function guessFrom(text) {
    const g = {}, t = String(text || '');
    const num = t.match(new RegExp('(\\d{1,3})\\s*' + NUM_WORDS, 'i'));
    if (num) g.count = num[1];
    const date = t.match(/\b([0-3]?\d)\.\s?([01]?\d)\.(?:\s?(20\d\d))?/);
    if (date) g.date = `${+date[1]}. ${+date[2]}.${date[3] ? ' ' + date[3] : ''}`;
    const time = t.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/) || t.match(/\bo\s+([01]?\d|2[0-3])\s*(?:h\b|hod)/i);
    if (time) g.time = time[2] ? `${time[1]}:${time[2]}` : `${time[1]}:00`;
    const mailAddr = t.match(/[^\s@<>()"]+@[^\s@<>()"]+\.[a-z]{2,}/i);
    if (mailAddr) g.email = mailAddr[0];
    const phone = t.match(/(?:\+421|0)\s?9\d{2}\s?\d{3}\s?\d{3}/);
    if (phone) g.phone = phone[0].replace(/\s+/g, ' ');
    // (bez príznaku „i“ – inak by \p{Lu} bralo aj malé písmená; veľké/malé na začiatku slova cez [Ss])
    const name = t.match(/(?:\b[Ss]om|[Vv]ol[aá]m sa|[Jj]menuj[iu] se|[Mm]eno:?|[Ss] pozdravom,?|[Ss] pozdravem,?|[Ďď]akujem,?|[Dd]íky,?)\s+(\p{Lu}\p{Ll}+)(?:[ \t]+(\p{Lu}\p{Ll}+))?/u);
    if (name) { g.first = name[1]; if (name[2]) g.last = name[2]; }
    return g;
  }
  // ku ktorému miestu sa hodí ktorý údaj (podľa názvu v zátvorke)
  function guessFor(key, g) {
    const k = norm(key);
    if (/pocet|kolko|osob|deti|hrac/.test(k)) return g.count;
    if (/datum|termin|den\b/.test(k) && !/novy|nahrad/.test(k)) return g.date;
    if (/\bcas\b|hodin/.test(k) && !/novy|nahrad|dlzk/.test(k)) return g.time;
    if (/mail/.test(k)) return g.email;
    if (/telef|cislo/.test(k)) return g.phone;
    if (/priezv/.test(k)) return g.last;
    if (/\bmeno\b/.test(k) && !/skupin|skol|firm|oslav/.test(k)) return g.first && g.last && !fieldsOfPicked().some(f => /priezv/.test(norm(f))) ? g.first + ' ' + g.last : g.first;
    return '';
  }
  const pickedTpl = () => pickId && tpls[pickId] ? { id: pickId, ...tpls[pickId] } : null;
  const fieldsOfPicked = () => { const t = pickedTpl(); return t ? fieldsOf(t.text) : []; };
  function pickTpl(id) {
    blurNow();
    readMail();
    pickId = id; vals = {}; guess = {};
    const g = guessFrom(mail);
    fieldsOfPicked().forEach(f => { const v = guessFor(f, g); if (v) { vals[f] = v; guess[f] = true; } });
    render();
    setTimeout(() => { const el = document.querySelector('.fl input'); if (el && !el.value) el.focus(); else { const o = $('outTx'); if (o) o.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }, 30);
  }
  function readMail() { if ($('mailIn')) mail = $('mailIn').value.slice(0, LIM.mail); }
  // písanie do políčka: zmení sa len výsledný text (bez prekreslenia celej stránky – políčko nestratí kurzor)
  function setVal(i, v) {
    const f = fieldsOfPicked()[i]; if (!f) return;
    vals[f] = String(v).slice(0, LIM.val); delete guess[f];
    const t = pickedTpl(), o = $('outTx'), w = $('missWarn');
    if (t && o) o.value = fillText(t.text);
    if (w) { const miss = fieldsOfPicked().filter(x => !(vals[x] || '').trim()); w.style.display = miss.length ? '' : 'none'; w.innerHTML = missHtml(miss); }
  }
  const missHtml = miss => `Ešte nie je doplnené: <b>${miss.map(esc).join(', ')}</b>. Doplň to vyššie, inak v texte ostane v [zátvorkách].`;
  async function copyOut() {
    const t = $('outTx') ? $('outTx').value : '';
    const miss = fieldsOfPicked().filter(x => !(vals[x] || '').trim());
    if (miss.length && !confirm(`Ešte nie je doplnené: ${miss.join(', ')}.\nKopírovať aj tak?`)) return;
    try { await navigator.clipboard.writeText(t); toast('Skopírované 📋 – vlož do e-mailu'); }
    catch (e) { const a = $('outTx'); if (a) { a.removeAttribute('readonly'); a.focus(); a.select(); try { document.execCommand('copy'); toast('Skopírované 📋'); } catch (x) { toast('Označ text a skopíruj ručne.'); } a.setAttribute('readonly', ''); } }
  }
  function clearReply() { blurNow(); mail = ''; pickId = ''; vals = {}; guess = {}; render(); window.scrollTo({ top: 0 }); }

  // ---- 📚 šablóny ----
  function openTpl(id) {
    const t = id ? tpls[id] : null;
    blurNow();
    tf = { id: id || '', title: t ? t.title || '' : '', when: t ? t.when || '' : '', text: t ? t.text || '' : '', err: '' };
    render();
  }
  function closeOv() { tf = null; render(); }
  function readTf() { if (!tf) return; ['title', 'when', 'text'].forEach(k => { const el = $('tf_' + k); if (el) tf[k] = el.value; }); }
  async function saveTpl() {
    readTf(); blurNow();
    const title = tf.title.trim().slice(0, LIM.title), when = tf.when.trim().slice(0, LIM.when), text = tf.text.trim().slice(0, LIM.text);
    if (!title) { tf.err = 'Napíš názov šablóny (napr. „Oslava – cenník“).'; return render(); }
    if (!text) { tf.err = 'Vlož text odpovede.'; return render(); }
    if (busyAct) return; busyAct = true;
    const db = firebase.database(), now = Date.now();
    const old = tf.id ? tpls[tf.id] || {} : {};
    const doc = { title, text, by: whoAmI().slice(0, 60), createdAt: old.createdAt || now, updatedAt: now, ...(when ? { when } : {}) };
    try {
      if (tf.id) await db.ref('ai/templates/' + tf.id).set(doc);
      else await db.ref('ai/templates').push(doc);
      tf = null; toast('Šablóna uložená ✓');
    } catch (e) { tf.err = 'Nepodarilo sa uložiť. ' + (isMgr ? 'Skontroluj, či sú vo Firebase vložené pravidlá „ai“.' : 'Ozvi sa vedúcemu.'); }
    busyAct = false; render();
  }
  async function delTpl(id) {
    if (!isMgr || !confirm('Zmazať túto šablónu?')) return;
    try { await firebase.database().ref('ai/templates/' + id).remove(); tf = null; if (pickId === id) pickId = ''; toast('Šablóna zmazaná'); render(); }
    catch (e) { toast('Nepodarilo sa zmazať.'); }
  }

  // ---- vykreslenie ----
  function replyHtml() {
    const list = ranked(), t = pickedTpl();
    if (!list.length) return `<div class="warn">Zatiaľ tu nie je žiadna šablóna. Pridaj v <b>📚 Šablóny</b> vaše hotové odpovede.</div>`;
    const top = list[0] && list[0].sc > 0 ? list[0].sc : 0;
    let h = `<div class="card"><p class="step">1 · E-mail od zákazníka (nepovinné)</p>
      <textarea id="mailIn" maxlength="${LIM.mail}" placeholder="Sem vlož e-mail od zákazníka – appka navrhne vhodnú odpoveď a skúsi doplniť meno, počet, dátum…" oninput="mail=this.value">${esc(mail)}</textarea>
      ${mail.trim() ? '' : '<p class="hint" style="margin:0">Alebo rovno vyber odpoveď nižšie.</p>'}</div>
      <div class="card"><p class="step">2 · Vyber odpoveď</p><div class="picks">
      ${list.map(x => { const sug = top && x.sc === top;
        return `<button class="pk ${sug ? 'sug' : ''} ${pickId === x.id ? 'on' : ''}" onclick="pickTpl('${x.id}')"><span class="tx">${esc(x.title || 'Bez názvu')}${x.when ? `<small>${esc(x.when)}</small>` : ''}</span>${sug ? '<span class="tag">⭐ sedí</span>' : ''}</button>`; }).join('')}
      </div></div>`;
    if (t) {
      const fs = fieldsOf(t.text), miss = fs.filter(x => !(vals[x] || '').trim());
      h += `<div class="card" style="border-left:5px solid var(--yellow)"><p class="step">3 · Doplň údaje</p>
        ${fs.length ? `<div class="fl">${fs.map((f, i) => `<label for="fv${i}">${esc(f)}${guess[f] ? '<small>✓ z e-mailu – skontroluj</small>' : ''}</label>
          <input id="fv${i}" maxlength="${LIM.val}" value="${esc(vals[f] || '')}" oninput="setVal(${i},this.value)" onkeydown="if(event.key==='Enter'){const n=document.getElementById('fv${i + 1}');if(n)n.focus();else this.blur();}">`).join('')}</div>`
          : '<p class="hint" style="margin:0">Táto odpoveď nemá čo doplniť – môžeš ju rovno skopírovať.</p>'}
      </div>
      <div class="card"><p class="step">4 · Hotová odpoveď</p>
        <textarea id="outTx" class="big" readonly>${esc(fillText(t.text))}</textarea>
        <div class="warn" id="missWarn" style="margin:0 0 8px;${miss.length ? '' : 'display:none'}">${miss.length ? missHtml(miss) : ''}</div>
        <div class="acts" style="margin-top:0">
          <button class="btn" onclick="copyOut()">📋 Kopírovať odpoveď</button>
          <button class="btn ghost" onclick="clearReply()">Nový e-mail</button>
        </div>
        <p class="hint" style="margin:10px 0 0">Skopíruj odpoveď do e-mailu a pred odoslaním ju ešte prečítaj. Drobnosti môžeš doladiť priamo v e-maile.</p></div>`;
    }
    return h;
  }
  function tplHtml() {
    const list = tplList();
    return `<div class="card"><p class="hint" style="margin:0 0 10px">Šablóny sú vaše hotové odpovede (detská oslava, potvrdenie rezervácie, obsadený termín, škola/firma, zrušenie…). Miesta, ktoré sa pri každom zákazníkovi menia, napíš do hranatých zátvoriek, napr. <b>[MENO]</b>, <b>[POČET DETÍ]</b>, <b>[DÁTUM]</b>, <b>[ČAS]</b> – pri odpovedaní sa pri nich ukážu políčka. Rovnaký názov v zátvorke = vyplní sa naraz na všetkých miestach.</p>
        <button class="btn" onclick="openTpl()">➕ Nová šablóna</button></div>
      ${list.length ? list.map(t => { const fs = fieldsOf(t.text); return `<div class="card tp" onclick="openTpl('${t.id}')"><h3>${esc(t.title || 'Bez názvu')}</h3>
          ${t.when ? `<p class="when">Kedy: ${esc(t.when)}</p>` : ''}${fs.length ? `<p class="when" style="color:var(--green)">Doplniť: ${esc(fs.join(', '))}</p>` : ''}<p>${esc(t.text)}</p></div>`; }).join('')
        : '<p class="empty">Zatiaľ žiadne šablóny.</p>'}`;
  }
  function settingsHtml() {
    return `<h2>👥 Kto vidí Odpovede</h2>
      <div class="card"><div class="seg" style="margin-bottom:8px"><button class="${!odpAll() ? 'on' : ''}" onclick="setOdpAll(false)">🔒 Len vedúci</button><button class="${odpAll() ? 'on' : ''}" onclick="setOdpAll(true)">👥 Aj zamestnanci</button></div>
        <p class="hint" style="margin:0">${odpAll() ? 'Zamestnanci vidia na úvode dlaždicu ✉️ Odpovede, môžu odpovedať a pridávať/upravovať šablóny. Mazanie šablón a toto nastavenie len vedúci. Jednotlivým ľuďom sa dá prístup zobrať na úvode v ⚙ Prístupy zamestnancov (✉️ Odpovede).' : 'Zamestnanci Odpovede na úvode nevidia. Ukáže sa im hneď, ako to tu prepneš.'}</p></div>`;
  }
  function tplFormHtml() {
    const fs = fieldsOf(tf.text);
    return `<div class="ov" onclick="if(event.target===this)closeOv()"><div class="box">
      <button class="x" onclick="closeOv()">✕</button>
      <h3>${tf.id ? '✎ Upraviť šablónu' : '➕ Nová šablóna'}</h3>
      <label class="f">Názov</label>
      <input id="tf_title" maxlength="${LIM.title}" placeholder="napr. Detská oslava – cena a priebeh" value="${esc(tf.title)}">
      <label class="f">Kedy ju použiť (nepovinné – slová odtiaľto pomáhajú navrhnúť správnu odpoveď)</label>
      <input id="tf_when" maxlength="${LIM.when}" placeholder="napr. oslava narodeniny deti Monster Chill" value="${esc(tf.when)}">
      <label class="f">Text odpovede</label>
      <textarea id="tf_text" class="big" maxlength="${LIM.text}" placeholder="Dobrý deň [MENO],&#10;ďakujeme za záujem o oslavu pre [POČET DETÍ] detí dňa [DÁTUM]…" oninput="const p=document.getElementById('tfFields');if(p)p.textContent=fieldsOfText(this.value)">${esc(tf.text)}</textarea>
      <p class="hint" id="tfFields" style="margin:-2px 0 8px">${esc(fieldsOfText(tf.text))}</p>
      <div class="err">${esc(tf.err)}</div>
      <div class="acts" style="margin-top:0">
        <button class="btn" onclick="saveTpl()" ${busyAct ? 'disabled' : ''}>💾 Uložiť</button>
        <button class="btn ghost" onclick="closeOv()">Zrušiť</button>
        ${tf.id && isMgr ? `<button class="btn red" onclick="delTpl('${tf.id}')" style="margin-left:auto">🗑 Zmazať</button>` : ''}
      </div></div></div>`;
  }
  function fieldsOfText(text) { const fs = fieldsOf(text); return fs.length ? 'Políčka na doplnenie: ' + fs.join(', ') : 'Zatiaľ žiadne políčka – miesta na doplnenie napíš do [HRANATÝCH ZÁTVORIEK].'; }
  function render() {
    // nerušiť písanie pri živej zmene dát (po opustení poľa sa prekreslí cez focusout)
    const a = document.activeElement;
    if (a && a.closest && a.closest('#app') && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || (a.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/.test(a.type)))) return;
    if (tf) readTf();   // formulár šablóny sa pri prekreslení nestratí
    if (pickId && !tpls[pickId] && loaded) { pickId = ''; vals = {}; }
    const app = $('app');
    let html = `<div class="top"><a href="./">‹ Úvod</a><h1>✉️ Odpovede na e-maily</h1></div>`;
    if (!authReady || hubAccess === null) { app.innerHTML = html + '<p class="empty">Načítavam…</p>'; return; }
    if (!canUse()) {
      app.innerHTML = html + `<div class="card"><p style="margin:0 0 10px">${!myName() && !isMgr ? 'Najprv sa prihlás na úvodnej stránke.' : 'Odpovede na e-maily zatiaľ používa len vedúci.'}</p><a class="btn" href="./" style="text-decoration:none;display:inline-block">‹ Na úvod</a></div>`;
      return;
    }
    if (!isMgr && view === 'set') view = 'reply';
    html += `<div class="tabs">${[['reply', '✉️ Odpovedať'], ['tpl', `📚 Šablóny (${tplList().length})`]].concat(isMgr ? [['set', '⚙ Nastavenia']] : [])
      .map(([k, l]) => `<button class="${view === k ? 'on' : ''}" onclick="setView('${k}')">${l}</button>`).join('')}</div>`;
    if (loadErr) html += `<div class="warn">${esc(loadErr)}</div>`;
    if (!loaded && !loadErr) html += '<p class="empty">Načítavam šablóny…</p>';
    else html += view === 'tpl' ? tplHtml() : view === 'set' ? settingsHtml() : replyHtml();
    html += `<footer>✉️ Odpovede na e-maily (odpovede.html) · verzia 2026-10-27</footer>`;
    if (tf) html += tplFormHtml();
    const ovScroll = document.querySelector('.ov') ? document.querySelector('.ov').scrollTop : 0;
    app.innerHTML = html;
    const ov = document.querySelector('.ov'); if (ov && ovScroll) ov.scrollTop = ovScroll;
  }

  // ---- Firebase ----
  let aiRef = null;
  function watch() {
    if (aiRef) { aiRef.off(); aiRef = null; }
    tpls = {}; loaded = false; loadErr = '';
    if (!canUse()) return;
    aiRef = firebase.database().ref('ai/templates');
    aiRef.on('value', s => { tpls = s.val() || {}; loaded = true; render(); },
      e => { console.error('[odpovede]', e); loadErr = 'Šablóny sa nepodarilo načítať. Skontroluj, či sú vo Firebase vložené pravidlá pre „ai“ (firebase-rules.json).'; render(); });
  }
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyB-2HeoePKrcsdawvI1LCOTQ6vWjibItpU",
      authDomain: "chillpoint-smeny-350c4.firebaseapp.com",
      databaseURL: "https://chillpoint-smeny-350c4-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "chillpoint-smeny-350c4",
      storageBucket: "chillpoint-smeny-350c4.firebasestorage.app",
      messagingSenderId: "251580957782",
      appId: "1:251580957782:web:801f838e4cd65abb4027f7"
    });
    // vedúci je prihlásený z úvodu (Firebase Auth je spoločné); v režime 👁 sa správa ako zamestnanec
    // zamestnanci: keď nikto nie je prihlásený, prihlási sa zariadenie (ako na úvode)
    let watching = false;
    const rewatch = () => { const on = canUse(); if (on !== watching) { watching = on; watch(); } };
    firebase.auth().onAuthStateChanged(async u => {
      authUser = u;
      if (!u) { try { await firebase.auth().signInWithEmailAndPassword(DEVICE_EMAIL, DEVICE_PASSWORD); return; } catch (e) {} }
      const mgr = !!u && (u.email || '').toLowerCase() === MANAGER_EMAIL && !ls.get('cp_viewAs');
      authReady = true;
      if (mgr !== isMgr) { isMgr = mgr; watching = canUse(); watch(); }
      else rewatch();
      render();
    });
    firebase.database().ref('settings/hubAccess').on('value', s => { hubAccess = s.val() || {}; rewatch(); render(); }, () => { hubAccess = {}; render(); });
  } catch (e) { $('app').innerHTML = '<p class="empty">Nepodarilo sa pripojiť. Skús obnoviť stránku.</p>'; }
  render();
  // po dopísaní e-mailu sa prekreslí (návrh ⭐ podľa nového textu) a dokreslia sa odložené zmeny
  window.addEventListener('focusout', () => setTimeout(render, 50));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && tf) closeOv(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  </script>
</body>
</html>
