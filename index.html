<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ChillPoint</title>
  <meta name="description" content="ChillPoint Laser Aréna Trnava – smeny, objednávky a nákupný zoznam">
  <meta name="theme-color" content="#0a0c0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ChillPoint">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
  <style>
    :root{--yellow:#f5bb16;--black:#0a0c0f;--panel:#17191d;--line:#34373c;--muted:#a7a9ad;--white:#fff;--red:#ff6c6c;--green:#5fd67a}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;overflow-x:clip}
    .wrap{width:min(560px,100% - 28px);margin:0 auto;padding:22px 0 40px}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
    .logo{width:52px;height:52px;border:3px solid var(--yellow);border-radius:50%;display:grid;place-items:center;font-weight:900;color:var(--yellow);font-size:15px}
    .brand b{display:block;font-size:20px;letter-spacing:.06em;line-height:1}
    .brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em;margin-top:4px;text-transform:uppercase}
    h1{font-size:30px;margin:0 0 18px;text-transform:uppercase;letter-spacing:.02em}
    .tiles{display:grid;gap:12px}
    .tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--white);
      padding:20px 18px;text-decoration:none;font:inherit;cursor:pointer;border-radius:0;-webkit-tap-highlight-color:transparent}
    .tile:hover,.tile:focus-visible{border-color:var(--yellow);outline:none}
    .tile:active{transform:scale(.99)}
    .tile .ic{font-size:34px;flex:0 0 46px;text-align:center}
    .tile .tx{flex:1;min-width:0}
    .tile .tx b{display:block;font-size:21px;text-transform:uppercase;letter-spacing:.03em}
    .tile .tx span{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.35}
    .tile .arr{color:var(--yellow);font-size:24px;font-weight:900}
    .tile.main{border-left:6px solid var(--yellow)}
    .tile .tx .badge{display:inline-block;background:var(--yellow);color:#111;font-weight:900;font-size:14px;padding:2px 8px;margin:0 0 0 8px;vertical-align:middle;letter-spacing:0}
    .shop{background:#111316;border:1px solid var(--line);border-top:0;padding:4px 16px 16px;display:none}
    .shop.open{display:block}
    .shop h5{margin:14px 0 6px;font-size:11px;letter-spacing:.1em;color:var(--muted)}
    .shop .it{padding:8px 0;border-bottom:1px solid #26292d;font-size:15px;display:flex;gap:8px}
    .shop .it small{color:var(--muted)}
    .shop .empty{color:var(--muted);font-size:13px;padding:6px 0}
    .shop a.go{display:block;margin-top:14px;text-align:center;background:var(--yellow);color:#111;font-weight:800;text-decoration:none;padding:12px;text-transform:uppercase;letter-spacing:.03em}
    footer{color:var(--muted);font-size:11px;opacity:.6;text-align:center;margin-top:28px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><div class="logo">CP</div><div><b>CHILL POINT</b><small>Laser aréna Trnava</small></div></div>
    <h1>Kam ideš?</h1>
    <div class="tiles">
      <a class="tile main" href="smeny.html">
        <span class="ic">📅</span>
        <span class="tx"><b>Smeny</b><span>Rozpis zmien, úlohy a navyše, vzal/a som si, potvrdenie účasti</span></span>
        <span class="arr">›</span>
      </a>
      <a class="tile main" href="objednavky.html">
        <span class="ic">🍹</span>
        <span class="tx"><b>Objednávky</b><span>Stoly, bar, atrakcie, platby a uzávierka</span></span>
        <span class="arr">›</span>
      </a>
      <div>
        <button class="tile main" id="shopTile" aria-expanded="false">
          <span class="ic">📦</span>
          <span class="tx"><b>Čo treba kúpiť <span class="badge" id="shopCount" hidden></span></b><span id="shopSub">Chýba / kúpiť – ťukni a pozri zoznam</span></span>
          <span class="arr" id="shopArr">▾</span>
        </button>
        <div class="shop" id="shop"><div class="empty">Načítavam…</div></div>
      </div>
    </div>
    <!-- pri nahrávaní na GitHub skontroluj: tento súbor = index.html (ÚVODNÁ stránka); Smeny = smeny.html -->
    <footer>🏠 Úvod (index.html) · verzia 2026-10-09</footer>
  </div>
  <script>
    // Úvodná stránka: rozcestník Smeny / Objednávky / Čo treba kúpiť. Nákupný zoznam sa číta naživo z tej istej
    // Firebase ako obe appky (board/) - len na čítanie; pridáva a odškrtáva sa v Smenách (smeny.html#kupit).
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const shop = document.getElementById('shop'), tile = document.getElementById('shopTile');
    let board = null, loadErr = false;
    tile.onclick = () => {
      const open = !shop.classList.contains('open');
      shop.classList.toggle('open', open); tile.setAttribute('aria-expanded', open);
      document.getElementById('shopArr').textContent = open ? '▴' : '▾';
    };
    function renderShop() {
      const goBtn = '<a class="go" href="smeny.html#kupit">➕ Pridať / odškrtnúť v Smenách</a>';
      if (loadErr) { shop.innerHTML = '<div class="empty">Zoznam sa nepodarilo načítať. Otvor ho v Smenách.</div>' + goBtn; return; }
      if (!board) return;
      const list = Object.values(board).filter(b => b && typeof b.text === 'string' && !b.done).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      const missing = list.filter(b => b.type !== 'buy'), buy = list.filter(b => b.type === 'buy');
      const row = b => `<div class="it">${b.type === 'buy' ? '🛒' : '🧺'} <span><b>${esc(b.text)}</b>${b.qty ? ' · ' + esc(b.qty) : ''} <small>${esc(b.author || '')}</small></span></div>`;
      const cnt = document.getElementById('shopCount');
      cnt.hidden = !list.length; cnt.textContent = list.length;
      document.getElementById('shopSub').textContent = list.length ? `Chýba: ${missing.length} · Kúpiť: ${buy.length} – ťukni a pozri zoznam` : 'Nič nechýba 👍';
      shop.innerHTML = `<h5>🧺 CHÝBA</h5>${missing.length ? missing.map(row).join('') : '<div class="empty">Nič nechýba.</div>'}
        <h5>🛒 KÚPIŤ</h5>${buy.length ? buy.map(row).join('') : '<div class="empty">Zatiaľ nič na kúpenie.</div>'}${goBtn}`;
    }
    try {
      firebase.initializeApp({
        apiKey: "AIzaSyB-2HeoePKrcsdawvI1LCOTQ6vWjibItpU",
        authDomain: "chillpoint-smeny-350c4.firebaseapp.com",
        databaseURL: "https://chillpoint-smeny-350c4-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "chillpoint-smeny-350c4",
        storageBucket: "chillpoint-smeny-350c4.firebasestorage.app",
        messagingSenderId: "251580957782",
        appId: "1:251580957782:web:801f838e4cd65abb4027f7"
      });
      firebase.database().ref('board').on('value', s => { board = s.val() || {}; renderShop(); }, () => { loadErr = true; renderShop(); });
    } catch (e) { loadErr = true; renderShop(); }
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
