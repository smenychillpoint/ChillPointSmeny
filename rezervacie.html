<html lang="sk">
<head>

  <link rel="icon" type="image/png" href="icon-192.png">

  <style>
    :root{--yellow:#f5bb16;--black:#0a0c0f;--panel:#17191d;--line:#34373c;--muted:#a7a9ad;--white:#fff;--red:#ff6c6c;--green:#5fd67a;--blue:#6fb3ff;--purple:#c58cff}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;overflow-x:clip}
    body:has(.ov){overflow:hidden}
    .wrap{width:min(1000px,100% - 24px);margin:0 auto;padding:14px 0 40px}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
    .top a{color:var(--yellow);text-decoration:none;font-weight:700;font-size:14px}
    h1{font-size:22px;margin:0;flex:1;text-transform:uppercase}
    h1 small{font-size:11px;background:var(--blue);color:#111;padding:2px 6px;vertical-align:middle;letter-spacing:.05em}
    h2{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:18px 0 8px;text-transform:uppercase}
    .card{background:var(--panel);border:1px solid var(--line);padding:14px;margin-bottom:10px}
    .btn{background:var(--yellow);color:#111;border:0;font:inherit;font-weight:800;padding:11px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;font-size:14px}
    .btn.sm{padding:7px 10px;font-size:12px}
    .btn.ghost{background:transparent;color:var(--white);border:1px solid var(--line)}
    .btn.red{background:transparent;color:var(--red);border:1px solid #7a3434}
    .btn:disabled{opacity:.5}
    input,select,textarea{width:100%;background:#0d0f11;color:#fff;border:1px solid #55585c;padding:10px;font:inherit;font-size:16px;margin-bottom:8px}
    textarea{min-height:56px;resize:vertical}
    label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
    .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
    .seg{display:flex;border:1px solid var(--line);margin-bottom:10px}
    .seg button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;padding:10px 8px;cursor:pointer}
    .seg button.on{background:var(--yellow);color:#111;font-weight:800}
    .seg.mc button.on{background:var(--purple)}
    .tabs{display:flex;gap:6px;margin-bottom:10px}
    .tabs button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--muted);font:inherit;font-size:14px;padding:10px;cursor:pointer}
    .tabs button.on{border-color:var(--yellow);color:var(--yellow);font-weight:800}
    /* hárok dňa – ako papierový zošit: Čas | Kto | Koľko | Kde */
    .dayhead{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
    .dayhead .ttl{flex:1;min-width:150px;text-align:center;font-size:18px;font-weight:800;text-transform:uppercase}
    .dayhead .ttl small{display:block;font-size:12px;color:var(--muted);font-weight:400;text-transform:none;margin-top:2px}
    .sheet{display:grid;grid-template-columns:minmax(0,1fr);gap:0 14px}
    @media(min-width:760px){.sheet{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
    .col{border:2px solid #4b4e53;background:#111316}
    .sr{display:grid;grid-template-columns:52px minmax(0,1fr) 54px minmax(0,72px);border-top:1px solid #2b2e33;min-height:40px;cursor:pointer}
    .sr:first-child{border-top:0}
    .sr.h{cursor:default;min-height:0;background:#1d2024;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
    .sr.h>span{padding:6px}
    .sr>span{padding:6px;border-left:1px solid #2b2e33;min-width:0;overflow:hidden;text-overflow:ellipsis}
    .sr>span:first-child{border-left:0}
    .sr .t{font-weight:700;color:#d0d2d5;font-variant-numeric:tabular-nums;display:flex;align-items:center}
    .sr.hour .t{color:var(--yellow)}
    .sr.hour{border-top:2px solid #4b4e53}
    .sr:not(.h):hover{background:#1a1d21}
    .sr.has{background:#1f1b0c}
    .sr.has.mc{background:#21132e}
    .sr.past{opacity:.55}
    .it{display:block;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .it b{font-size:15px}
    .it small{color:var(--muted);font-size:11px}
    .mcb{display:inline-block;background:var(--purple);color:#111;font-size:10px;font-weight:900;padding:1px 4px;margin-right:4px;vertical-align:middle}
    .nb{display:inline-block;background:var(--yellow);color:#111;font-size:10px;font-weight:900;padding:1px 4px;margin-right:4px;vertical-align:middle}
    .ar{color:var(--blue);font-size:11px;font-weight:700}
    .attr{border-left:5px solid var(--purple)}
    .attr .ln{padding:8px 0;border-top:1px solid #2b2e33;font-size:14px;line-height:1.45;cursor:pointer}
    .attr .ln:first-of-type{border-top:0}
    /* zoznam a detail */
    .bk{border-left:5px solid var(--yellow);cursor:pointer}
    .bk.st-confirmed{border-left-color:var(--green)}
    .bk.st-arrived{border-left-color:var(--blue);opacity:.8}
    .bk.st-cancelled{border-left-color:#555;opacity:.55}
    .bk.mc{border-left-color:var(--purple)}
    .tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;margin-left:4px;vertical-align:middle}
    .tag.new{background:var(--yellow);color:#111}.tag.confirmed{background:#1d4a2a;color:var(--green)}
    .tag.arrived{background:#173049;color:var(--blue)}.tag.cancelled{background:#333;color:#bbb}
    .tag.src{background:#26292d;color:var(--muted);font-weight:400}
    .tag.mc{background:var(--purple);color:#111}
    .times{font-size:15px;margin:6px 0;color:var(--yellow);font-weight:700}
    .info{font-size:14px;color:#d9dbde;line-height:1.6}
    .info a{color:var(--blue)}
    .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
    .day{font-size:13px;letter-spacing:.08em;color:var(--yellow);margin:18px 0 6px;text-transform:uppercase;font-weight:800}
    .ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:5;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(12px,env(safe-area-inset-top)) 10px 30px}
    .box{background:var(--panel);border:1px solid var(--yellow);width:min(560px,100%);padding:16px;position:relative}
    .box.mc{border-color:var(--purple)}
    .box .x{position:sticky;top:0;float:right;background:#26292d;border:1px solid var(--line);color:#fff;font-size:18px;width:36px;height:36px;cursor:pointer;margin:-6px -6px 0 8px}
    .box h3{margin:0 0 12px;font-size:18px}
    .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px;margin:6px 0 10px}
    .slot{background:#0d0f11;border:1px solid var(--line);color:#fff;font:inherit;font-size:14px;padding:9px 0;cursor:pointer}
    .slot.picked{background:var(--yellow);color:#111;font-weight:800;border-color:var(--yellow)}
    .slot.busy{background:#3a1717;color:#ff9a9a;border-color:#6d2a2a;cursor:not-allowed}
    .slot.rest{color:var(--muted);border-style:dashed}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
    .chip{background:#26292d;border:1px solid var(--line);color:#fff;font:inherit;font-size:13px;padding:6px 9px;cursor:pointer}
    .chip.on{background:var(--yellow);color:#111;font-weight:800}
    .mcinfo{background:#21132e;border:1px solid #5b3a80;padding:10px 12px;font-size:14px;line-height:1.55;margin-bottom:10px}
    .empty{color:var(--muted);font-size:14px;padding:6px 0}
    .err{color:var(--red);font-size:13px;min-height:18px;font-weight:700}
    .warn{background:#2a2410;border:1px solid #6b5a1a;color:#ffd66b;font-size:13px;padding:10px;margin-bottom:10px;line-height:1.45}
    footer{color:var(--muted);font-size:11px;opacity:.6;text-align:center;margin-top:28px}
    .mut{color:var(--muted)}
    .hint{font-size:12px;color:var(--muted);margin:-4px 0 8px;line-height:1.4}
    .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .tag.offer{background:#3b2d07;color:var(--yellow)}
    /* 🗓 kalendár mesiaca */
    .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:8px}
    .cal .cw{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em;padding:2px 0}
    .cd{background:var(--panel);border:1px solid var(--line);color:#fff;font:inherit;min-height:52px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-width:0}
    .cd.blank{background:none;border:0;cursor:default}
    .cd .dn{font-size:14px;font-weight:700}
    .cd .cnt{background:var(--yellow);color:#111;font-size:12px;font-weight:900;padding:1px 6px;white-space:nowrap}
    .cd .cl{font-size:10px;color:#777}
    .cd.closed{background:#121315;color:#777}
    .cd.past{opacity:.6}
    .cd.today{border-color:var(--yellow)}
    .cd.today .dn{color:var(--yellow)}
    .cd.on{outline:2px solid var(--yellow);outline-offset:-2px;background:#2a2410}
    /* tabuľka dňa */
    .tblwrap{overflow-x:auto;border:1px solid var(--line);margin-bottom:8px}
    .dt{width:100%;border-collapse:collapse;min-width:760px;font-size:14px}
    .dt th{background:#1d2024;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:7px 8px;white-space:nowrap}
    .dt td{border-top:1px solid #2b2e33;padding:7px 8px;vertical-align:top}
    .dt td.t{font-weight:700;font-variant-numeric:tabular-nums;color:#d0d2d5;white-space:nowrap}
    .dt td.em{word-break:break-all;max-width:190px}
    .dt td.ac{white-space:nowrap}
    .dt td.ac .btn{margin:0 2px 3px 0}
    .dt a{color:var(--blue)}
    .dt a.nm,a.nm{color:#fff;font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:#555}
    .dt .nt{color:#d9c88a}
    .dt tr.free td{color:var(--muted)}
    .dt tr.blk td{background:#15171a;font-size:12px}
    .dt tr.bkr{background:#1f1b0c}
    .dt tr.bkr.st-confirmed{background:#122317}
    .dt tr.bkr.st-arrived{background:#111e2b}
    .dt tr.bkr.mc{box-shadow:inset 4px 0 0 var(--purple)}
    .dt tr.past{opacity:.55}
    /* nastavenia */
    .hrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:5px 0;border-top:1px solid #2b2e33}
    .hrow:first-child{border-top:0}
    .hrow select{margin:0;padding:7px}
    label.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
    label.chk input{width:20px;height:20px;margin:0;flex:none}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--yellow);color:#111;font-weight:700;padding:10px 16px;z-index:9;max-width:90vw}
  </style>
</head>
<body>
  <div class="wrap" id="app"><p class="empty">Načítavam…</p></div>
  <script>
  // ===== 📆 REZERVÁCIE LASER GAME + MONSTER CHILL =====
  // Kto ich vidí: vedúci vždy; zamestnanci len keď vedúci zapne settings/hubAccess/rezAll (⚙ Nastavenia tu)
  // a zamestnanec nemá na úvode v Prístupoch odškrtnuté „📆 Rezervácie“ (settings/hubAccess/e/<meno>/rezervacie = false).
  // Zamestnanec nevidí telefón/e-mail, ⚙ Nastavenia, „Ako zákazník“ ani 🗑 Zmazať. Číta cez prihlásené zariadenie (DEVICE_EMAIL).
  // 2026-10-25 prvá verzia, 2026-10-26 hárok dňa ako papierový zošit (Čas | Kto | Koľko | Kde) + Monster Chill.
  // Rovnaké dáta ako rezervácia na webe (WordPress plugin chillpoint-rezervacie):
  //   laser/<env>/bookings/<id> = {name, phone?, email?, players, games:{"YYYY-MM-DD_HHMM":true}, consent, createdAt, status,
  //                                note?, source?, pkg? 'laser'|'monster', seat? (kde sedia), mStart? 'HH:MM', mOrder? 'games'|'attr'}
  //   laser/<env>/slots/<YYYY-MM-DD>/<HHMM> = <id>   ← web podľa toho ukazuje obsadené časy (červené)
  // env = 'test' | 'live' (podľa režimu pluginu). Zmeny tu sa hneď prejavia na webe.
  const MANAGER_EMAIL = 'vedouci@chillpoint-smeny.sk';
  // (2026-10-26) prehliadač nemá ponúkať uložené heslá v políčkach rezervácie (meno, telefón, poznámka…)
  (function () {
    const off = el => { if (el.matches && el.matches('input:not([autocomplete]):not([type=password]),textarea:not([autocomplete])')) el.setAttribute('autocomplete', 'off'); };
    const fix = root => { off(root); if (root.querySelectorAll) root.querySelectorAll('input,textarea').forEach(off); };
    fix(document.documentElement);
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) fix(n); }))).observe(document.documentElement, { childList: true, subtree: true });
  })();
  // zdieľané zariadenie (ako na úvode a v Objednávkach) – aby zamestnanci mohli čítať rezervácie
  const DEVICE_EMAIL = 'zariadenie@chillpoint-smeny.sk', DEVICE_PASSWORD = 'CP-PcZtW5wlmH9xuY';
  // Nastavenia rezervácií = laser/<env>/config (plugin ich načíta a prepíšu jeho WordPress nastavenia).
  // DEF = predvolené hodnoty pluginu; kým config nie je uložený, web berie hodiny z WordPressu (tu sa ukážu tieto).
  // hours: kľúč = deň v týždni (0 = nedeľa), chýbajúci deň = zatvorené; "24:00" = polnoc
  const DEF = { hours: { 0: ['13:00', '22:00'], 1: ['15:00', '22:00'], 2: ['15:00', '22:00'], 3: ['15:00', '22:00'], 4: ['15:00', '22:00'], 5: ['15:00', '24:00'], 6: ['13:00', '24:00'] },
    daysOff: [], step: 20, game: 15, change: 5, rest: 40, minPlayers: 2, maxPlayers: 16, maxGames: 8, leadMinutes: 15, offer: { minPlayers: 8, paid: 3, free: 1 } };
  const CFG_KEYS = ['hours', 'daysOff', 'step', 'game', 'change', 'rest', 'minPlayers', 'maxPlayers', 'maxGames', 'leadMinutes', 'offer'];
  // hra 15 min + 5 min výmena → iná partia najskôr o 20 min (BLOCK); tá istá partia oddych 40 min (rest)
  let B = null, BLOCK = 20;
  function mergeCfg(c) {
    const o = JSON.parse(JSON.stringify(DEF));
    if (c && typeof c === 'object') CFG_KEYS.forEach(k => { if (c[k] !== undefined && c[k] !== null) o[k] = c[k]; });
    if (!Array.isArray(o.daysOff)) o.daysOff = Object.values(o.daysOff || {});   // "" (prázdne dni voľna) → []
    return o;
  }
  function applyCfg(c) { B = mergeCfg(c); BLOCK = (+B.game || 15) + (+B.change || 0); }
  applyCfg(null);
  // vedúci smie zapísať aj mimo limitov webu (pravidlá Firebase: 1–30 hráčov)
  const ADM = { minPlayers: 1, maxPlayers: 30 };
  // zatvorený deň: hárok aj tak ukáže 12:00 – 23:40 (vedúci môže zapísať výnimku)
  const T_FROM = 12 * 60, T_TO = 23 * 60 + 40;
  // 🎁 Monster Chill (chillpoint.sk/oslavy: 8–12 ľudí, 3 hry laser game, VR + PS5 60 min…)
  //   najprv hry: hry v čase začiatku, +40, +80; potom (často pizza) atrakcie VR + PS spolu cca 60 min
  //   najprv atrakcie: atrakcie 60 min od začiatku, potom 3 hry
  //   ďalší Monster Chill môže začať najskôr 60 min po začiatku predchádzajúceho (16:20 → 17:20)
  // (2026-10-27) Balíčky sa dajú upravovať v ⚙ Nastavenia → 🎁 Balíčky: settings/rezPackages/{id} =
  //   {name, games (počet hier laser game), attrMin (atrakcie min), attrText ("VR + PS"), pizzaMin (pauza po hrách),
  //    spacing (ďalší balíček najskôr o X min po začiatku), players (predvolený počet ľudí)}
  // Kým nie je nič uložené, platí predvolený Monster Chill. Rezervácia má pkg = id balíčka ('laser' = len laser game).
  const PKG_DEF = { monster: { name: 'Monster Chill', games: 3, attrMin: 60, attrText: 'VR + PS', pizzaMin: 30, spacing: 60, players: 10 } };
  let pkgRaw = null;   // settings/rezPackages (null = ešte nenačítané / nič uložené)
  const PKG_NUM = { games: [1, 12, 3], attrMin: [0, 600, 60], pizzaMin: [0, 240, 30], spacing: [0, 600, 60], players: [1, 30, 10] };
  function pkgNorm(p) {
    const o = { name: String((p && p.name) || 'Balíček').slice(0, 40), attrText: String((p && p.attrText != null ? p.attrText : 'VR + PS')).slice(0, 40) };
    Object.keys(PKG_NUM).forEach(k => { const [lo, hi, d] = PKG_NUM[k], v = parseInt(p && p[k], 10); o[k] = Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : d; });
    return o;
  }
  function pkgs() { const src = pkgRaw && Object.keys(pkgRaw).length ? pkgRaw : PKG_DEF; const out = {}; Object.keys(src).forEach(id => { if (src[id]) out[id] = pkgNorm(src[id]); }); return out; }
  // balíček rezervácie (null = len laser game); neznámy balíček (zmazaný v nastaveniach) → predvolené hodnoty s jeho id
  const pkgOf = b => (b && b.pkg && b.pkg !== 'laser') ? (pkgs()[b.pkg] || pkgNorm({ name: b.pkg === 'monster' ? 'Monster Chill' : b.pkg })) : null;
  const pkgShort = p => p.name.split(/\s+/).filter(Boolean).map(w => w[0]).join('').toUpperCase().slice(0, 4) || 'B';
  const STATUS = { new: '🆕 nová', confirmed: '✓ potvrdená', arrived: '🚶 prišli', cancelled: '✕ zrušená' };
  const DAY_NAMES = ['nedeľa', 'pondelok', 'utorok', 'streda', 'štvrtok', 'piatok', 'sobota'];

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const toTime = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  const dayTitle = k => { const d = new Date(k + 'T12:00:00'); return `${DAY_NAMES[d.getDay()]} ${d.getDate()}. ${d.getMonth() + 1}.`; };
  const addDays = (k, n) => { const d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
  const blurNow = () => { try { document.activeElement && document.activeElement.blur(); } catch (e) {} };
  // otváracie hodiny dňa v minútach [od, do] alebo null = zatvorené (ako hoursFor v plugine)
  function hoursFor(date) {
    if ((B.daysOff || []).includes(date)) return null;
    const h = (B.hours || {})[new Date(date + 'T12:00:00').getDay()];
    return h && h[0] && h[1] ? [toMin(h[0]), toMin(h[1]) || 1440] : null;
  }
  // začiatky hier podľa nastavení (ako timesFor v plugine, bez odrátania minulých)
  function dayTimes(date) {
    const h = hoursFor(date), out = [], st = Math.max(5, +B.step || 20), g = +B.game || 15;
    if (!h) return out;
    for (let m = h[0]; m + g <= h[1]; m += st) out.push(toTime(m));
    return out;
  }
  // mriežka časov pre hárok a formulár: podľa nastavení, v zatvorený deň náhradná 12:00 – 23:40
  function gridTimes(date) {
    const t = dayTimes(date);
    if (t.length) return t;
    const out = [], st = Math.max(5, +B.step || 20);
    for (let m = T_FROM; m <= T_TO; m += st) out.push(toTime(m));
    return out;
  }
  // 🎁 ponuka 3+1 (ako v plugine): partia ≥ offer.minPlayers, v jeden deň každá (paid+free)-tá hra zadarmo
  const offerOn = () => !!(B.offer && B.offer.minPlayers && B.offer.paid);

  // ---- 🗓 kalendár (mesiac) + tabuľka dňa ----

  // ---- ⚙ nastavenia rezervácií (laser/<env>/config) ----
  const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
  const HOUR_OPTS = []; for (let m = 6 * 60; m <= 1440; m += 15) HOUR_OPTS.push(toTime(m));   // 24:00 = polnoc
  function cfgFromB(o) {
    const of = o.offer && o.offer.minPlayers && o.offer.paid ? o.offer : null;
    return {
      hours: [0, 1, 2, 3, 4, 5, 6].map(i => { const h = (o.hours || {})[i];
        return h && h[0] && h[1] ? { open: true, from: h[0], to: h[1] } : { open: false, from: DEF.hours[i][0], to: DEF.hours[i][1] }; }),
      daysOff: [...(o.daysOff || [])].filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort(),
      step: o.step, game: o.game, change: o.change, rest: o.rest, minPlayers: o.minPlayers, maxPlayers: o.maxPlayers, maxGames: o.maxGames, leadMinutes: o.leadMinutes,
      offerOn: !!of, oMin: of ? of.minPlayers : 8, oPaid: of ? of.paid : 3, oFree: of ? (of.free || 1) : 1
    };
  }
  function cfgSet(k, v) { cfgF[k] = v; cfgDirty = true; cfgErr = ''; }
  function cfgSetR(k, v) { cfgSet(k, v); blurNow(); render(); }
  function cfgHour(i, k, v) { cfgF.hours[i][k] = v; cfgDirty = true; cfgErr = ''; blurNow(); render(); }
  function cfgAddOff() {
    const k = ($('cOff').value || '').trim(); blurNow();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) { toast('Vyber dátum.'); return; }
    if (!cfgF.daysOff.includes(k)) { cfgF.daysOff.push(k); cfgF.daysOff.sort(); cfgDirty = true; }
    render();
  }
  function cfgDelOff(k) { cfgF.daysOff = cfgF.daysOff.filter(x => x !== k); cfgDirty = true; render(); }
  function cfgDiscard() { cfgF = null; cfgDirty = false; cfgErr = ''; render(); }
  async function cfgCopyOther() {
    const other = env === 'live' ? 'test' : 'live';

      const c = (await firebase.database().ref(`laser/${other}/config`).once('value')).val();
      if (!c) { toast(`${other === 'live' ? 'Ostrá' : 'Testovacia'} časť nemá uložené nastavenia.`); return; }
      cfgF = cfgFromB(mergeCfg(c)); cfgDirty = true; cfgErr = ''; toast('Prevzaté – skontroluj a ulož.'); render();

  async function cfgResetWp() {
    if (busyAct || !confirm('Zmazať nastavenia z appky? Web potom použije nastavenia z WordPressu.')) return;
    busyAct = true;
    try { await firebase.database().ref(`${base()}/config`).remove(); cfgF = null; cfgDirty = false; toast('Web používa nastavenia z WordPressu'); }
    catch (e) { toast('Nepodarilo sa zmazať.'); }
    busyAct = false; render();
  }
  async function saveCfg() {
    blurNow();
    if (!cfgF || busyAct || !isMgr) return;
    const c = cfgF, fail = m => { cfgErr = m; render(); };
    const NUMS = [['step', 'Krok (začiatky hier)', 5, 120], ['game', 'Dĺžka hry', 5, 120], ['change', 'Výmena partií', 0, 60], ['rest', 'Oddych partie', 0, 240],
      ['minPlayers', 'Najmenej hráčov', 1, 30], ['maxPlayers', 'Najviac hráčov', 1, 30], ['maxGames', 'Najviac hier v rezervácii', 1, 30], ['leadMinutes', 'Rezervácia najneskôr pred hrou', 0, 1440]];
    const out = {};
    for (const [k, label, lo, hi] of NUMS) {
      const v = Number(c[k]);
      if (!Number.isInteger(v) || v < lo || v > hi) return fail(`${label}: zadaj celé číslo ${lo}–${hi}.`);
      out[k] = v;
    }
    if (out.maxPlayers < out.minPlayers) return fail('Najviac hráčov musí byť aspoň toľko ako najmenej.');
    out.hours = {};
    for (const i of DAY_ORDER) {
      const h = c.hours[i]; if (!h.open) continue;
      if (toMin(h.from) >= (toMin(h.to) || 1440)) return fail(`${DAY_NAMES[i]}: koniec musí byť po začiatku.`);
      out.hours[i] = [h.from, h.to];
    }
    if (!Object.keys(out.hours).length) return fail('Aspoň jeden deň musí byť otvorený (na zatvorenie konkrétnych dní použi Dni voľna).');
    // prázdne pole by Firebase vynechal a web by vzal dni voľna z WordPressu → "" (plugin z neho spraví [])
    out.daysOff = c.daysOff.length ? [...c.daysOff].sort() : '';
    if (c.offerOn) {
      const o = { minPlayers: Number(c.oMin), paid: Number(c.oPaid), free: Number(c.oFree) };
      if (!Number.isInteger(o.minPlayers) || o.minPlayers < 1 || o.minPlayers > 30) return fail('Ponuka: od koľkých hráčov 1–30.');
      if (!Number.isInteger(o.paid) || o.paid < 1 || o.paid > 10) return fail('Ponuka: platených hier 1–10.');
      if (!Number.isInteger(o.free) || o.free < 1 || o.free > 5) return fail('Ponuka: zadarmo 1–5.');
      out.offer = o;
    } else out.offer = false;
    out.updatedAt = firebase.database.ServerValue.TIMESTAMP;
    busyAct = true;
    try { await firebase.database().ref(`${base()}/config`).set(out); cfgF = null; cfgDirty = false; cfgErr = ''; toast('Nastavenia uložené – web ich použije pri ďalšom načítaní ✓'); }
    catch (e) { console.error(e); cfgErr = String(e.code || e.message || '').toUpperCase().includes('PERMISSION')
      ? 'Firebase to nedovolil – nastavenia smie meniť len vedúci a vo Firebase musia byť vložené pravidlá „laser“ (firebase-rules.json).' : 'Nepodarilo sa uložiť, skús znova.'; }

  }
  function settingsHtml() {

        : `⚠ Pre ${env === 'test' ? '🧪 test' : '🟢 ostrý web'} zatiaľ nie sú nastavenia uložené – web berie nastavenia z WordPressu. Nižšie sú predvolené hodnoty; po uložení ich web začne používať.`}
        <br><span class="mut">Test a Ostré majú nastavenia zvlášť.</span></div>
      ${cfgDirty ? '<div class="warn">✎ Máš neuložené zmeny.</div>' : ''}

      <h2>👥 Hráči (na webe)</h2>

        <p class="hint" style="margin:0">Vedúci tu v appke môže zapísať 1–30 hráčov bez ohľadu na toto.</p></div>
      <h2>🎁 Ponuka ${c.offerOn ? esc(c.oPaid) + '+' + esc(c.oFree) : '3+1'}</h2>
      <div class="card">
        <label class="chk" style="margin-bottom:10px"><input type="checkbox" ${c.offerOn ? 'checked' : ''} onchange="cfgSetR('offerOn',this.checked)"><b>Ponuka zapnutá</b></label>
        ${c.offerOn ? `<div class="row3">
          <div><label class="f">Od koľkých hráčov</label><input id="c_oMin" type="number" inputmode="numeric" value="${esc(c.oMin)}" oninput="cfgSet('oMin',this.value)"></div>
          <div><label class="f">Platené hry</label><input id="c_oPaid" type="number" inputmode="numeric" value="${esc(c.oPaid)}" oninput="cfgSet('oPaid',this.value)"></div>
          <div><label class="f">Zadarmo</label><input id="c_oFree" type="number" inputmode="numeric" value="${esc(c.oFree)}" oninput="cfgSet('oFree',this.value)"></div></div>
          <p class="hint" style="margin:0">Partia aspoň ${esc(c.oMin)} hráčov, ktorá si v jeden deň vyberie ${esc(c.oPaid)} hry, dostane ďalšiu zadarmo.</p>` : '<p class="hint" style="margin:0">Web ponuku neukazuje.</p>'}</div>
      <div class="err">${esc(cfgErr)}</div>
      <div class="acts" style="position:sticky;bottom:0;background:var(--black);padding:10px 0;flex-wrap:nowrap">
        <button class="btn" style="flex:1" onclick="saveCfg()">💾 Uložiť pre ${env === 'test' ? '🧪 test' : '🟢 ostrý web'}</button>
        ${cfgDirty ? '<button class="btn ghost" onclick="cfgDiscard()">↺ Zahodiť</button>' : ''}</div>
      <div class="acts" style="margin-top:0">
        <button class="btn ghost sm" onclick="cfgCopyOther()">📋 Prevziať z ${env === 'test' ? 'Ostrého' : 'Testu'}</button>
        ${cfgRaw ? '<button class="btn red sm" onclick="cfgResetWp()">Vrátiť na WordPress</button>' : ''}
      </div>`;
  }

  // ---- zoznam nadchádzajúcich ----
  function cardHtml(b) {
    const st = STATUS[b.status] ? b.status : 'new', g = gamesOf(b);
    const times = g.map(x => x.date === firstGame(b).date ? x.time : `${dayTitle(x.date)} ${x.time}`).join(' · ');
    return `<div class="card bk st-${st}${isMc(b) ? ' mc' : ''}" onclick="openDetail('${b.id}')">
      <b style="font-size:16px">${esc(b.name)}</b> <span class="tag ${st}">${STATUS[st]}</span>${isMc(b) ? `<span class="tag mc">🎁 ${esc(pkgOf(b).name)}</span>` : ''}
      <div class="times">🕹 ${esc(times)} · 👥 ${esc(b.players)}${b.seat ? ` · 📍 ${esc(b.seat)}` : ''}</div></div>`;
  }
  function listHtml() {
    const items = list(), tk = todayKey(), nNew = items.filter(b => (b.status || 'new') === 'new').length;
    let html = `<button class="btn" style="width:100%;margin-bottom:6px" onclick="openForm('',{day:todayKey()})">➕ Rezervovať</button>
      <h2>${showOld ? 'Všetky rezervácie' : 'Nadchádzajúce'} · ${items.length}${nNew ? ` · <span style="color:var(--yellow)">🆕 ${nNew} nových</span>` : ''}</h2>`;
    let lastDay = '';
    items.forEach(b => {
      const d = firstGame(b).date;
      if (d !== lastDay) { lastDay = d; html += `<div class="day">${d === tk ? 'DNES · ' : ''}${esc(dayTitle(d))}</div>`; }
      html += cardHtml(b);
    });
    if (!items.length) html += `<div class="empty">Žiadne ${showOld ? '' : 'nadchádzajúce '}rezervácie.</div>`;
    return html + `<button class="btn ghost sm" style="margin-top:12px" onclick="showOld=!showOld;render()">${showOld ? 'Len nadchádzajúce' : 'Zobraziť aj staré a zrušené'}</button>`;
  }

  // ---- okno: detail rezervácie ----
  function detailHtml(b) {
    const st = STATUS[b.status] ? b.status : 'new', g = gamesOf(b), mc = isMc(b);
    const created = typeof b.createdAt === 'number' ? new Date(b.createdAt) : null;
    const a = mc ? mcAttr(b) : null;
    return `<div class="ov" onclick="if(event.target===this)closeOv()"><div class="box${mc ? ' mc' : ''}">
      <button class="x" onclick="closeOv()">✕</button>
      <h3>${esc(b.name)}</h3>
      <div><span class="tag ${st}" style="margin-left:0">${STATUS[st]}</span>${mc ? `<span class="tag mc">🎁 ${esc(pkgOf(b).name)}</span>` : '<span class="tag src">🔫 Laser game</span>'}${b.source === 'admin' ? '<span class="tag src">zapísali sme my</span>' : '<span class="tag src">z webu</span>'}</div>
      <div class="info" style="margin-top:10px">
        👥 <b>${esc(b.players)}</b> ${plural(+b.players || 0, 'osoba', 'osoby', 'osôb')}${b.seat ? ` · 📍 <b>${esc(b.seat)}</b>` : ''}<br>
        🕹 ${[...new Set(g.map(x => x.date))].map(dd => `${esc(dayTitle(dd))}: <b>${g.filter(x => x.date === dd).map(x => x.time).join(' · ')}</b>`).join('; ')} <span style="color:var(--muted)">(${g.length} ${plural(g.length, 'hra', 'hry', 'hier')})</span>
        ${[...new Set(g.map(x => x.date))].map(dd => { const oi = offerInfo(b, dd); return oi ? `<br>🎁 Ponuka ${oi.name}${g.some(x => x.date !== dd) ? ` (${esc(dayTitle(dd))})` : ''}: zadarmo hra o <b>${oi.free.join(', ')}</b>` : ''; }).join('')}
        ${mc ? `<br>🎁 začiatok <b>${esc(b.mStart || firstGame(b).time)}</b> · ${b.mOrder === 'attr' ? 'najprv atrakcie, potom laser game' : 'najprv laser game, potom atrakcie'}<br>
          ${pkgOf(b).attrMin ? `<span style="color:var(--purple)">🎮 ${esc(pkgOf(b).attrText || 'Atrakcie')} cca ${toTime(a.from)}–${toTime(a.to)}${a.pizza ? ' (po hrách, niekedy ešte pizza)' : ''}</span>` : ''}` : ''}
        ${canSeeContact() ? `${b.phone ? `<br>📞 <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>` : ''}${b.email ? `<br>✉ <a href="mailto:${esc(b.email)}">${esc(b.email)}</a>` : ''}` : ''}
        ${b.note ? `<br>📝 ${esc(b.note)}` : ''}
        ${created ? `<br><span style="color:var(--muted);font-size:12px">vytvorené ${created.getDate()}. ${created.getMonth() + 1}. ${pad(created.getHours())}:${pad(created.getMinutes())}</span>` : ''}
      </div>
      <div class="acts">
        ${st === 'new' ? `<button class="btn sm" onclick="setStatus('${b.id}','confirmed')">✓ Potvrdiť</button>` : ''}
        ${st === 'new' || st === 'confirmed' ? `<button class="btn sm ghost" onclick="setStatus('${b.id}','arrived')">🚶 Prišli</button>` : ''}
        ${st === 'arrived' ? `<button class="btn sm ghost" onclick="setStatus('${b.id}','confirmed')">↺ Ešte neprišli</button>` : ''}
        <button class="btn sm ghost" onclick="openForm('${b.id}')">✎ Upraviť</button>
        ${st !== 'cancelled' ? `<button class="btn sm red" onclick="cancelBooking('${b.id}')">✕ Zrušiť</button>` : ''}
        ${isMgr ? `<button class="btn sm red" onclick="deleteBooking('${b.id}')">🗑 Zmazať</button>` : ''}
      </div></div></div>`;
  }

  // ---- okno: rezervovať / upraviť ----
  function formHtml() {
    const d = f.day, P = fPkg(), mc = !!P, PK = pkgs();
    const slotBtn = t => {
      const picked = f.items.some(it => it.date === d && it.time === t), busy = !picked && busyBy(d, t, f.id), rest = !picked && !busy && restNear(d, t);
      return `<button class="slot ${picked ? 'picked' : busy ? 'busy' : rest ? 'rest' : ''}" onclick="toggleSlot('${d}','${t}')"${busy ? ' title="obsadené"' : ''}>${t}</button>`;
    };
    const grid = gridTimes(d), times = grid.concat(f.items.filter(it => it.date === d && !grid.includes(it.time)).map(it => it.time)).sort();
    const quick = [0, 1, 2, 3, 4, 5, 6].map(n => { const k = addDays(todayKey(), n), x = new Date(k + 'T12:00:00');
      return `<button class="chip${k === d ? ' on' : ''}" onclick="setFormDay('${k}')">${n === 0 ? 'Dnes' : n === 1 ? 'Zajtra' : DAY_NAMES[x.getDay()].slice(0, 2) + ' ' + x.getDate() + '.'}</button>`; }).join('');
    let mcHtml = '';
    if (mc) {
      const clash = mcClash(d, f.mStart, f.id, P), a = mcAttr({ games: Object.fromEntries(f.items.map(it => [it.date + '_' + it.time.replace(':', ''), true])), mStart: f.mStart, mOrder: f.mOrder }, P);
      const busyG = f.items.filter(it => busyBy(it.date, it.time, f.id));
      mcHtml = `<label class="f">Začiatok – ${esc(P.name)} (${P.games} ${plural(P.games, 'hra', 'hry', 'hier')}${P.attrMin ? ` + ${esc(P.attrText || 'atrakcie')} ${P.attrMin} min` : ''})</label>
        <select id="fMStart" onchange="blurNow();setMc('mStart',this.value)">${(grid.includes(f.mStart) ? grid : grid.concat(f.mStart).sort()).map(t => `<option ${t === f.mStart ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <div class="seg mc"><button class="${f.mOrder === 'games' ? 'on' : ''}" onclick="setMc('mOrder','games')">🔫 Najprv laser game</button><button class="${f.mOrder === 'attr' ? 'on' : ''}" onclick="setMc('mOrder','attr')">🎮 Najprv atrakcie</button></div>
        <div class="mcinfo">🔫 Laser game: <b>${f.items.map(it => it.time).join(' · ') || '—'}</b><br>
          ${P.attrMin ? `🎮 ${esc(P.attrText || 'Atrakcie')} cca <b>${toTime(a.from)}–${toTime(a.to)}</b>${a.pizza ? ' (po hrách, niekedy ešte pizza)' : ''}` : ''}
          ${clash ? `<div class="err" style="margin-top:6px">⚠ ${esc(pkgOf(clash).name)} ${esc(clash.name)} začína o ${esc(clash.mStart || firstGame(clash).time)} – ďalší balíček najskôr o ${Math.max(P.spacing, pkgOf(clash).spacing)} min neskôr.</div>` : ''}
          ${busyG.length ? `<div class="err" style="margin-top:6px">⚠ Obsadené inou partiou: ${busyG.map(it => it.time).join(', ')} – posuň začiatok alebo uprav časy nižšie.</div>` : ''}</div>`;
    }
    return `<div class="ov" onclick="if(event.target===this)closeOv()"><div class="box${mc ? ' mc' : ''}">
      <button class="x" onclick="closeOv()">✕</button>
      <h3>${f.id ? '✎ Upraviť rezerváciu' : '➕ Rezervovať'}</h3>
      <label class="f">Deň</label>
      <div class="chips">${quick}</div>
      <input id="fDate" type="date" value="${d}" onchange="blurNow();setFormDay(this.value)">
      <div style="font-weight:800;margin:2px 0 10px;text-transform:uppercase">${esc(dayTitle(d))}${hoursFor(d) ? '' : ' <span style="color:var(--red);font-size:12px;text-transform:none">· podľa nastavení zatvorené</span>'}</div>
      <label class="f">Čo si rezervujú</label>
      <div class="seg" style="flex-wrap:wrap"><button class="${!mc ? 'on' : ''}" onclick="setPkg('laser')">🔫 Len laser game</button>${Object.keys(PK).map(id => `<button class="${f.pkg === id ? 'on' : ''}" onclick="setPkg('${id}')" style="${f.pkg === id ? 'background:var(--purple)' : ''}">🎁 ${esc(PK[id].name)}</button>`).join('')}
        ${mc && !PK[f.pkg] ? `<button class="on" style="background:var(--purple)">🎁 ${esc(P.name)}</button>` : ''}</div>
      ${mcHtml}
      <label class="f">Meno (kto)</label><input id="fName" maxlength="80" value="${esc(f.name)}" oninput="f.name=this.value" placeholder="Meno a priezvisko">
      <div class="row2">
        <div><label class="f">Koľko osôb</label><input id="fPlayers" type="number" inputmode="numeric" min="1" max="30" value="${esc(f.players)}" oninput="f.players=this.value"></div>
        <div><label class="f">Kde budú sedieť</label><input id="fSeat" maxlength="60" list="seatList" value="${esc(f.seat)}" oninput="f.seat=this.value" placeholder="napr. P3, gauč"></div>
      </div>
      <datalist id="seatList">${['Gauč', 'Stolík'].concat(tableNames).map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <div class="row2">
        <div><label class="f">Telefón (nepovinné)</label><input id="fPhone" type="tel" maxlength="30" value="${esc(f.phone)}" oninput="f.phone=this.value" placeholder="0910 123 456"></div>
        <div><label class="f">E-mail (nepovinné)</label><input id="fEmail" type="email" maxlength="100" value="${esc(f.email)}" oninput="f.email=this.value"></div>
      </div>
      <label class="f">Poznámka (nepovinné, web ju nevidí)</label><textarea id="fNote" maxlength="400" oninput="f.note=this.value" placeholder="napr. oslava, torta, pizza, záloha…">${esc(f.note)}</textarea>
      <label class="f">${mc ? 'Časy laser game (vypočítané – môžeš upraviť)' : 'Časy laser game'}</label>
      <div class="slots">${times.map(slotBtn).join('')}</div>
      <div class="row2" style="align-items:start"><input id="fTime" type="time" step="300"><button class="btn ghost" onclick="addCustomTime()">+ Vlastný čas</button></div>
      <p class="empty" style="font-size:12px;margin:0 0 8px">Červené = má iná partia. Prerušované = menej ako ${B.rest} min od inej hry tejto partie.</p>
      <div class="info"><b>Vybrané:</b> ${f.items.length ? f.items.map(it => `<button class="chip" onclick="toggleSlot('${it.date}','${it.time}')">${it.date !== d ? esc(dayTitle(it.date)) + ' ' : ''}${it.time} ✕</button>`).join(' ') : '<span style="color:var(--muted)">zatiaľ nič</span>'}</div>
      <div class="err">${esc(f.err)}</div>
      <div class="acts"><button class="btn" onclick="saveForm()">${f.id ? 'Uložiť zmeny' : 'Rezervovať'}</button><button class="btn ghost" onclick="closeOv()">Zrušiť</button></div>
    </div></div>`;
  }

  function render() {
    // nerušiť písanie vo formulári pri živej zmene dát
    // (každé textové pole / výber v appke; po opustení poľa sa prekreslí cez focusout)
    const a = document.activeElement;
    if (a && a.closest && a.closest('#app') && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || (a.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/.test(a.type)))) return;
    const app = $('app');
    let html = `<div class="top"><a href="./">‹ Úvod</a><a href="objednavky.html">🍹 Objednávky</a><h1>🎯 Rezervácie laser game</h1></div>`;
    if (!authReady || hubAccess === null) { app.innerHTML = html + '<p class="empty">Načítavam…</p>'; return; }
    if (!canUse()) {
      app.innerHTML = html + `<div class="card"><p style="margin:0 0 10px">${!myName() ? 'Najprv sa prihlás na úvodnej stránke.' : 'Rezervácie zatiaľ vidí len vedúci.'}</p><a class="btn" href="./" style="text-decoration:none;display:inline-block">‹ Na úvod</a></div>`;
      return;
    }
    if (!isMgr && view === 'set') view = 'cal';
    // okno (formulár / detail) sa kreslí nad stránku; scroll okna sa zachová
    const ovScroll = document.querySelector('.ov') ? document.querySelector('.ov').scrollTop : 0;
    html += `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <div class="seg" style="flex:1;min-width:220px;margin:0"><button class="${env === 'test' ? 'on' : ''}" onclick="setEnv('test')">🧪 Test</button><button class="${env === 'live' ? 'on' : ''}" onclick="setEnv('live')">🟢 Ostré (web)</button></div>
        ${env === 'test' && isMgr ? '<a class="btn ghost sm" href="https://smenychillpoint.github.io/Teststranky/" target="_blank" rel="noopener" style="text-decoration:none">🧪 Ako zákazník ›</a>' : ''}</div>
      <div class="tabs">${[['cal', '🗓 Kalendár'], ['sheet', '📋 Hárok dňa'], ['list', '📃 Zoznam']].concat(isMgr ? [['set', '⚙ Nastavenia']] : [])
        .map(([k, l]) => `<button class="${view === k ? 'on' : ''}" onclick="setView('${k}')">${l}</button>`).join('')}</div>`;
    if (loadErr) html += `<div class="warn">${esc(loadErr)}</div>`;
    if (view === 'set') html += settingsHtml();
    else if (!loaded && !loadErr) { app.innerHTML = html + '<p class="empty">Načítavam rezervácie…</p>'; return; }
    else html += view === 'cal' ? calHtml() : view === 'sheet' ? sheetHtml() : listHtml();
    html += `<p class="empty" style="font-size:12px;margin-top:14px">${env === 'test' ? '🧪 Testovacia časť – sem idú rezervácie z testovacej stránky a z webu, kým je plugin v režime „Test“.' : '🟢 Ostré rezervácie zákazníkov z webu.'} Čo tu pridáš, upravíš alebo zrušíš, sa hneď ukáže na webe (obsadené / voľné časy).</p>
      <footer>🎯 Rezervácie laser game (rezervacie.html) · verzia 2026-10-27</footer>`;
    if (f) html += formHtml();
    else if (sel && bookings[sel]) html += detailHtml({ id: sel, ...bookings[sel] });
    app.innerHTML = html;
    const ov = document.querySelector('.ov'); if (ov && ovScroll) ov.scrollTop = ovScroll;
  }

  // ---- Firebase ----
  let offFns = [];
  function watch() {
    offFns.forEach(fn => fn()); offFns = [];
    bookings = {}; slots = {}; loaded = false; loadErr = '';
    cfgRaw = null; cfgLoaded = false; cfgF = null; cfgDirty = false; cfgErr = ''; applyCfg(null);
    if (!canUse()) return;
    const db = firebase.database();
    const err = e => { console.error('[rezervácie]', e); loadErr = 'Rezervácie sa nepodarilo načítať. Skontroluj, či sú vo Firebase vložené pravidlá pre „laser“ (firebase-rules.json).'; render(); };
    const bRef = db.ref(`${base()}/bookings`), sRef = db.ref(`${base()}/slots`), cRef = db.ref(`${base()}/config`);
    const bCb = bRef.on('value', s => { bookings = s.val() || {}; loaded = true; render(); }, err);
    const sCb = sRef.on('value', s => { slots = s.val() || {}; render(); }, err);
    // nastavenia: rozpísané (neuložené) zmeny sa živou zmenou neprepíšu
    const cCb = cRef.on('value', s => { cfgRaw = s.val(); applyCfg(cfgRaw); cfgLoaded = true; if (!cfgDirty) cfgF = null; render(); },
      e => { console.error('[rezervácie config]', e); cfgLoaded = true; render(); });
    offFns.push(() => bRef.off('value', bCb), () => sRef.off('value', sCb), () => cRef.off('value', cCb));
    // stoly z Objednávok – návrhy do „Kde budú sedieť“
    db.ref('tables').once('value').then(s => {
      tableNames = Object.values(s.val() || {}).filter(t => t && t.name && !t.temp).map(t => String(t.name)).sort((a, b) => a.localeCompare(b, 'sk', { numeric: true }));
    }).catch(() => {});
  }
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyB-2HeoePKrcsdawvI1LCOTQ6vWjibItpU",
      authDomain: "chillpoint-smeny-350c4.firebaseapp.com",
      databaseURL: "https://chillpoint-smeny-350c4-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "chillpoint-smeny-350c4",
      storageBucket: "chillpoint-smeny-350c4.firebasestorage.app",
      messagingSenderId: "251580957782",
      appId: "1:251580957782:web:801f838e4cd65abb4027f7"
    });
    // vedúci je prihlásený z úvodu (Firebase Auth je spoločné pre celú appku); v režime 👁 sa správa ako zamestnanec
    // zamestnanci: keď nikto nie je prihlásený, prihlási sa zariadenie (ako na úvode)
    let watching = false;
    const rewatch = () => { const on = canUse(); if (on !== watching) { watching = on; watch(); } };
    firebase.auth().onAuthStateChanged(async u => {
      authUser = u;
      if (!u) { try { await firebase.auth().signInWithEmailAndPassword(DEVICE_EMAIL, DEVICE_PASSWORD); return; } catch (e) {} }
      const mgr = !!u && (u.email || '').toLowerCase() === MANAGER_EMAIL && !ls.get('cp_viewAs');
      authReady = true;
      if (mgr !== isMgr) { isMgr = mgr; watching = canUse(); watch(); }   // watch() zruší staré odbery a pripojí nové
      else rewatch();
      render();
    });
    // 🎁 balíčky (verejne čitateľné, mení len vedúci)
    firebase.database().ref('settings/rezPackages').on('value', s => { pkgRaw = s.val(); render(); }, () => {});
    // odkaz z úvodu „Nastavenia rezervácií“ (rezervacie.html#nastavenia)
    if (location.hash === '#nastavenia') view = 'set';
    firebase.database().ref('settings/hubAccess').on('value', s => { hubAccess = s.val() || {}; rewatch(); render(); }, () => { hubAccess = {}; render(); });
  } catch (e) { $('app').innerHTML = '<p class="empty">Nepodarilo sa pripojiť. Skús obnoviť stránku.</p>'; }
  render();
  window.addEventListener('focusout', () => setTimeout(render, 50));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && (f || sel)) closeOv(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  </script>
